<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1626">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Caixa">
<title>Caixa · controle de gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#f5f7fa; --surface:#ffffff; --surface-2:#edf1f6; --ink:#0f1b2d; --muted:#5b6676;
  --line:#e3e8ef; --line-strong:#cdd5e0; --accent:#22457a; --accent-ink:#ffffff;
  --pos:#10925a; --neg:#d64550; --pos-soft:#e2f3ec; --neg-soft:#fbe7e8;
  --shadow:0 1px 2px rgba(15,28,31,.06),0 8px 24px rgba(15,28,31,.06);
  --radius:16px; --radius-sm:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1626; --surface:#111f33; --surface-2:#16273d; --ink:#e8edf4; --muted:#93a1b5;
    --line:#233348; --line-strong:#31455f; --accent:#5e95e6; --accent-ink:#06213f;
    --pos:#34d399; --neg:#f87171; --pos-soft:#0f2e24; --neg-soft:#351a1c;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1626; --surface:#111f33; --surface-2:#16273d; --ink:#e8edf4; --muted:#93a1b5;
  --line:#233348; --line-strong:#31455f; --accent:#5e95e6; --accent-ink:#06213f;
  --pos:#34d399; --neg:#f87171; --pos-soft:#0f2e24; --neg-soft:#351a1c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-feature-settings:"tnum" 1,"cv05" 1;
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
  overflow-x:hidden;
}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:600}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select{font-family:inherit;font-size:16px}
.app{max-width:960px;margin:0 auto;padding:0 16px 130px;min-height:100vh;min-height:100lvh}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:18px 2px 10px;position:sticky;top:env(safe-area-inset-top,0px);background:linear-gradient(var(--bg) 70%,transparent);z-index:20}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand>div{min-width:0}
.brand h1{font-size:18px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:"Space Grotesk";font-weight:700;font-size:17px}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:-1px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:17px}
.iconbtn:active{transform:scale(.95)}
.topactions{display:flex;gap:6px;align-items:center;flex-shrink:0}
.topnav{display:flex;align-items:center;gap:1px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:2px}
.toplbl{border:0;background:transparent;color:var(--ink);font-weight:600;font-size:12px;padding:4px 2px;text-transform:capitalize;max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toptoggle{border:0;border-left:1px solid var(--line);background:transparent;color:var(--accent);font-weight:600;font-size:12px;padding:4px 8px;margin-left:2px}
.toptoggle.on{background:var(--accent);color:var(--accent-ink);border-radius:8px;border-left:0}
.brand small{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* period bar */
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 0;border-radius:9px;font-size:13px;font-weight:600}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chev{width:28px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--muted);display:grid;place-items:center;font-size:17px}
.chev:active{background:var(--line)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero{padding:20px;margin-bottom:14px}
.hero .cap{font-size:12px;color:var(--muted);font-weight:600}
.hero .bal{font-family:"Space Grotesk";font-weight:700;letter-spacing:-.02em;font-size:40px;line-height:1.05;margin:6px 0 2px}
.hero .bal.pos{color:var(--accent)} .hero .bal.neg{color:var(--neg)}
.flows{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.flow{border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px}
.flow .t{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-weight:600}
.flow .v{font-family:"Space Grotesk";font-weight:600;font-size:19px;margin-top:4px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.flow.in .dot{background:var(--pos)} .flow.out .dot{background:var(--neg)}
.flow.in .v{color:var(--pos)} .flow.out .v{color:var(--neg)}

.sec-h{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 12px}
.sec-h h2{font-size:15px;letter-spacing:-.01em}
.sec-h .sub{font-size:12px;color:var(--muted)}
.link{color:var(--accent);background:0;border:0;font-weight:600;font-size:13px}

.chartcard{padding:18px}
.donutwrap{position:relative;height:210px;margin:4px auto 6px}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donut-center .c-cap{font-size:11px;color:var(--muted);font-weight:600}
.donut-center .c-val{font-family:"Space Grotesk";font-weight:700;font-size:22px;margin-top:2px}
.legend{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.legrow{display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:9px}
.legrow:active{background:var(--surface-2)}
.legrow .nm{flex:1;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legrow .pc{font-size:12px;color:var(--muted);width:42px;text-align:right}
.legrow .amt{font-weight:600;font-size:14px;min-width:84px;text-align:right}
.barwrap{height:220px;margin-top:6px}

/* lists */
.list{display:flex;flex-direction:column}
.tx{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.tx .mid{flex:1;min-width:0}
.tx .d{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .m{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .amt{font-weight:600;font-size:15px;white-space:nowrap}
.tx .amt.in{color:var(--pos)} .tx .amt.out{color:var(--ink)}
.tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted);margin-left:6px;vertical-align:middle}

.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:34px}
.empty h3{color:var(--ink);font-size:16px;margin:10px 0 4px}
.empty p{font-size:13px;margin:0 0 16px;line-height:1.5}

.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:600;font-size:14px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);border:1px solid var(--line-strong);color:var(--ink)}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.btn.sm{padding:8px 12px;font-size:13px}

/* account/card/sub rows */
.accrow{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line)}
.accrow:last-child{border-bottom:0}
.swatch{width:40px;height:40px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;color:#fff;font-weight:700;font-family:"Space Grotesk"}
.accrow .mid{flex:1;min-width:0}
.accrow .nm{font-weight:600;font-size:14px}
.accrow .meta{font-size:12px;color:var(--muted);margin-top:2px}
.accrow .right{text-align:right}
.accrow .right .v{font-weight:600;font-size:15px}
.bar-mini{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.bar-mini span{display:block;height:100%;border-radius:4px;background:var(--accent)}
.bar-mini span.warn{background:var(--neg)}

/* bottom nav */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 20px);max-width:520px;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:22px;display:flex;justify-content:space-between;padding:9px 4px;box-shadow:0 10px 30px rgba(0,0,0,.22)}
.tabbar button{flex:1 1 0;min-width:0;border:0;background:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:9.5px;font-weight:600;padding:4px 0;overflow:hidden}
.tabbar button .tl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabbar button .ti{line-height:0;display:grid;place-items:center}
.tabbar button.on{color:var(--accent)}
.tabbar button.on .ti{filter:none}
.tabbar button.on{color:var(--accent)}
.fab{position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:31;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-size:28px;box-shadow:0 10px 26px rgba(10,20,40,.45);display:grid;place-items:center}
.fab:active{transform:scale(.94)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(5,12,13,.5);z-index:40;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:22px 22px 0 0;padding:8px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease}
@media(min-width:620px){.scrim{align-items:center}.sheet{border-radius:22px;max-height:88vh}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.grip{width:38px;height:4px;border-radius:3px;background:var(--line-strong);margin:8px auto 14px}
.sheet-top{position:sticky;top:0;z-index:6;background:var(--surface);padding:10px 0;margin:0 0 8px;display:flex;align-items:center;gap:10px}
.sheet-back{flex-shrink:0;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);display:grid;place-items:center}
.sheet-back:active{transform:scale(.95)}
.sheet-title{font-size:18px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet h2{font-size:18px;margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;padding:12px;border:1px solid var(--line-strong);border-radius:11px;background:var(--surface-2);color:var(--ink)}
.field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.typetog{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.typetog button{padding:12px;border-radius:11px;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:14px;color:var(--muted)}
.typetog button.on-out{border-color:var(--neg);background:var(--neg-soft);color:var(--neg)}
.typetog button.on-in{border-color:var(--pos);background:var(--pos-soft);color:var(--pos)}
.swatchpick{display:flex;flex-wrap:wrap;gap:8px}
.swatchpick button{width:30px;height:30px;border-radius:8px;border:2px solid transparent}
.swatchpick button.on{border-color:var(--ink)}
.sheet-actions{display:flex;gap:10px;margin-top:8px}
.sheet-actions .btn{flex:1}
.del{color:var(--neg);background:0;border:0;font-weight:600;font-size:13px;margin-top:14px;width:100%;padding:10px}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin:10px 0 0}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 10px}
.mtile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);text-align:left;min-height:84px}
.mtile:active{transform:scale(.98)}
.mtile .ic{color:var(--accent);line-height:0;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--surface)}
.mtile .t{font-weight:600;font-size:13px;line-height:1.2}
details.mgroup{border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden;background:var(--surface)}
details.mgroup>summary{list-style:none;cursor:pointer;padding:14px;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:space-between}
details.mgroup>summary::-webkit-details-marker{display:none}
details.mgroup>summary::after{content:'▾';color:var(--muted);font-size:11px}
details.mgroup[open]>summary::after{content:'▴'}
details.mgroup .menu-item{padding-left:14px;padding-right:14px;border-top:1px solid var(--line);border-bottom:0}
.menu-item{display:flex;align-items:center;gap:12px;padding:15px 4px;border-bottom:1px solid var(--line);font-weight:500;font-size:14px;width:100%;background:0;border-left:0;border-right:0;border-top:0;text-align:left}
.menu-item:last-child{border-bottom:0}
.menu-item .mi{font-size:19px;width:24px;text-align:center}
.menu-item small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:2px}
.callout{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13px;line-height:1.55;color:var(--muted)}
.callout b{color:var(--ink)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px}
.chip{flex-shrink:0;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.subtotal{display:flex;justify-content:space-between;align-items:baseline;padding:16px;border-radius:14px;background:var(--surface-2);margin-bottom:6px}
.subtotal .v{font-family:"Space Grotesk";font-weight:700;font-size:26px}
/* telas estreitas (iPhone SE / Androids pequenos): evita cortar o cabeçalho e estourar números grandes */
@media (max-width:380px){
  .hero .bal{font-size:30px}
  .subtotal .v{font-size:21px}
  .toplbl{max-width:64px;font-size:11px}
  .chev{width:24px}
  .toptoggle{padding:4px 6px;font-size:11px}
  .iconbtn{width:34px;height:34px;font-size:15px}
  .flows{gap:8px}
  .flow{padding:10px}
  .flow .v{font-size:17px}
  .app{padding:0 12px 130px}
}
@media (max-width:330px){
  .hero .bal{font-size:26px}
}
.hidden{display:none!important}
.file{display:none}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="mark">C</div>
      <div><h1>Caixa</h1><small id="brandSub">seu dinheiro, claro</small></div>
    </div>
    <div class="topactions">
      <div class="topnav" id="topnav">
        <button class="chev" id="prevP" aria-label="Anterior">‹</button>
        <button class="toplbl" id="periodLblTop" title="Toque para hoje">—</button>
        <button class="chev" id="nextP" aria-label="Próximo">›</button>
        <button class="toptoggle" id="periodTog" title="Ver o ano inteiro">Ano</button>
      </div>
      <button class="iconbtn" id="bellBtn" title="Notificações" aria-label="Notificações" style="position:relative;display:none"><span id="bellIco"></span><span id="bellBadge" style="position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--neg);color:#fff;font-size:10px;font-weight:700;display:none;place-items:center;line-height:1">0</span></button>
      <button class="iconbtn" id="menuBtn" title="Menu" aria-label="Menu">≡</button>
    </div>
  </div>

  <main id="view"></main>
</div>

<button class="fab" id="fab" aria-label="Novo lançamento">+</button>

<nav class="tabbar" id="tabbar"></nav>

<!-- modal host -->
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<input type="file" id="fileIn" class="file" accept=".json,.csv,.ofx,.pdf">

<script>
"use strict";
/* ---------- utils ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=> (crypto.randomUUID?crypto.randomUUID():Date.now()+''+Math.random().toString(16).slice(2));
let hideVals=(()=>{try{return localStorage.getItem('caixa.hide')==='1';}catch(e){return false;}})();
function toggleHide(){ hideVals=!hideVals; try{localStorage.setItem('caixa.hide',hideVals?'1':'0');}catch(e){} render(); }
const brl=v=> hideVals ? 'R$ ••••' : new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
function svgIcon(name,size=16){
  const a=`width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;display:inline-block"`;
  const P={
    eye:'<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>',
    eyeOff:'<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20C5 20 1 12 1 12a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>',
    card:'<rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/>',
    bank:'<line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 20 7 4 7"/>',
    cloud:'<path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>',
    safe:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="12" cy="12" r="3.3"/><line x1="12" y1="12" x2="14.1" y2="10.3"/><line x1="7" y1="20" x2="7" y2="22"/><line x1="17" y1="20" x2="17" y2="22"/>',
    back:'<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
    home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V10"/>',

/* ---------- period ---------- */
const sod=d=>{d=new Date(d);d.setHours(0,0,0,0);return d;};
const eod=d=>{d=new Date(d);d.setHours(23,59,59,999);return d;};
function range(p,ref){
  const r=new Date(ref);
  if(p==='day')return{start:sod(r),end:eod(r)};
  if(p==='week'){const off=(r.getDay()+6)%7;const s=sod(r);s.setDate(r.getDate()-off);const e=eod(s);e.setDate(s.getDate()+6);return{start:s,end:e};}
  if(p==='month')return{start:sod(new Date(r.getFullYear(),r.getMonth(),1)),end:eod(new Date(r.getFullYear(),r.getMonth()+1,0))};
  return{start:sod(new Date(r.getFullYear(),0,1)),end:eod(new Date(r.getFullYear(),11,31))};
}
function shift(p,ref,dir){
  const r=new Date(ref);
  if(p==='day')r.setDate(r.getDate()+dir);
  else if(p==='week')r.setDate(r.getDate()+7*dir);
  else if(p==='month')r.setMonth(r.getMonth()+dir);
  else r.setFullYear(r.getFullYear()+dir);
  return r;
}
function periodLabelShort(p,ref){
  const r=new Date(ref);
  if(p==='day')return new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short'}).format(r).replace('.','');
  if(p==='week'){const {start,end}=range('week',r);const d=x=>new Intl.DateTimeFormat('pt-BR',{day:'2-digit'}).format(x);const mn=x=>new Intl.DateTimeFormat('pt-BR',{month:'short'}).format(x).replace('.','');return d(start)+'–'+d(end)+' '+mn(end);}
  if(p==='month'){const s=new Intl.DateTimeFormat('pt-BR',{month:'long'}).format(r);return s.charAt(0).toUpperCase()+s.slice(1);}
  return String(r.getFullYear());
}

function buckets(p,ref){
  const r=new Date(ref);
  if(p==='day'){const{start,end}=range('day',r);return[{label:'hoje',start,end}];}
  if(p==='week'){const{start}=range('week',r);const out=[];const names=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
    for(let i=0;i<7;i++){const s=new Date(start);s.setDate(start.getDate()+i);out.push({label:names[i],start:sod(s),end:eod(s)});}return out;}
  if(p==='month'){const{start,end}=range('month',r);const out=[];let s=new Date(start),w=1;
    while(s<=end){const e=new Date(s);e.setDate(s.getDate()+6);out.push({label:'Sem '+w,start:sod(s),end:eod(e>end?end:e)});s.setDate(s.getDate()+7);w++;}return out;}
  const out=[];const nm=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  for(let i=0;i<12;i++)out.push({label:nm[i],start:sod(new Date(r.getFullYear(),i,1)),end:eod(new Date(r.getFullYear(),i+1,0))});
  return out;
}

function carriedBalance(beforeDate){
  // dinheiro real em caixa: saldos iniciais + movimentos de CONTA (gasto no cartão não baixa o caixa até pagar a fatura)
  let b=S.accounts.reduce((a,ac)=>a+(ac.opening||0),0);
  S.transactions.forEach(t=>{ if(t.card||!t.account)return; if(parseD(t.date)<beforeDate){ b += t.type==='income'? t.amount : -t.amount; } });
  return b;
}
function computeAlerts(){
  const alerts=[];
  const today=new Date(); today.setHours(0,0,0,0);
  const dUntil=day=>{let d=new Date(today.getFullYear(),today.getMonth(),Math.min(day,28));if(d<today)d=new Date(today.getFullYear(),today.getMonth()+1,Math.min(day,28));return Math.round((d-today)/86400000);};
  const emDias=dd=>dd===0?'hoje':'em '+dd+' dia'+(dd>1?'s':'');
  S.cards.forEach(c=>{
    if(c.closingDay){const dd=dUntil(c.closingDay);if(dd<=5)alerts.push(`Fatura do ${c.name} fecha ${emDias(dd)}.`);}
    if(c.dueDay){const dd=dUntil(c.dueDay);if(dd<=5)alerts.push(`Fatura do ${c.name} vence ${emDias(dd)}.`);}
  });
  (S.subscriptions||[]).filter(s=>s.active!==false&&s.nextDate).forEach(s=>{
    const dd=Math.round((parseD(s.nextDate)-today)/86400000);
    if(dd>=0&&dd<=5)alerts.push(`${s.name} renova ${emDias(dd)}.`);
  });
  if(S.budgets&&Object.keys(S.budgets).length){
    const mR=range('month',new Date()); const sp={};
    S.transactions.forEach(t=>{if(t.type==='expense'&&t.categoryId&&!t.transfer&&!t.faturaOf){const d=parseD(t.date);if(d>=mR.start&&d<=mR.end)sp[t.categoryId]=(sp[t.categoryId]||0)+t.amount;}});
    Object.keys(S.budgets).forEach(cid=>{const c=catById(cid);if(c&&(sp[cid]||0)>S.budgets[cid])alerts.push(`Orçamento de ${c.name} estourado.`);});
  }
  return alerts;
}
function dueSoon(){
  const today=new Date(); today.setHours(0,0,0,0);
  const items=[];
  const dUntil=day=>{let d=new Date(today.getFullYear(),today.getMonth(),Math.min(day,28));if(d<today)d=new Date(today.getFullYear(),today.getMonth()+1,Math.min(day,28));return Math.round((d-today)/86400000);};
  S.cards.forEach(c=>{ const inv=cardInvoice(c); if(inv>0&&c.dueDay){ const dd=dUntil(c.dueDay); if(dd<=7)items.push({kind:'card',id:c.id,label:'Fatura · '+c.name,amount:inv,dias:dd}); } });
  (S.subscriptions||[]).filter(s=>s.active!==false&&s.nextDate).forEach(s=>{ const dd=Math.round((parseD(s.nextDate)-today)/86400000); if(dd>=0&&dd<=7)items.push({kind:'sub',id:s.id,label:s.name,amount:s.amount,dias:dd}); });
  items.sort((a,b)=>a.dias-b.dias);
  return items;
}
function lancarSub(id){
  const s=S.subscriptions.find(x=>x.id===id); if(!s)return;
  const acc=S.accounts[0]&&S.accounts[0].id;
  S.transactions.push({id:uid(),type:'expense',amount:s.amount,desc:s.name,categoryId:s.categoryId||null,date:todayStr(),account:acc,card:null,subId:s.id});
  const d=parseD(s.nextDate||todayStr());
  if(s.freq==='yearly')d.setFullYear(d.getFullYear()+1); else if(s.freq==='weekly')d.setDate(d.getDate()+7); else d.setMonth(d.getMonth()+1);
  s.nextDate=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  save(); render();
}
function networthAt(D){
  const t0=D.getTime();
  let cash=S.accounts.reduce((a,ac)=>a+(ac.opening||0),0), cardDebt=0, cof=0;
  S.transactions.forEach(t=>{ const d=parseD(t.date).getTime(); if(d>t0)return;
    if(t.card){ if(t.type==='expense')cardDebt+=t.amount; }
    else if(t.account){ cash += t.type==='income'? t.amount : -t.amount; if(t.faturaOf)cardDebt-=t.amount; }
  });
  (S.cofrinho&&S.cofrinho.deposits||[]).forEach(dp=>{ if(parseD(dp.date).getTime()<=t0)cof+=dp.amount; });
  return cash + cof - Math.max(cardDebt,0);
}

      <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.label)}</div>
        <div style="font-size:11px;color:var(--muted)">${it.dias===0?'vence hoje':'em '+it.dias+' dia'+(it.dias>1?'s':'')} · ${brl(it.amount)}</div></div>

function txRow(t){
  const c=catById(t.categoryId);
  const src = t.card?cardById(t.card)?.name : accById(t.account)?.name;
  const col=c?c.color:'#888';
  const d=new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short'}).format(parseD(t.date)).replace('.','');

function monthlyCost(s){ return s.freq==='yearly'? s.amount/12 : s.freq==='weekly'? s.amount*4.33 : s.amount; }
const ym=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
function fixosMensal(){ return (S.fixos||[]).filter(f=>f.active!==false).reduce((a,f)=>a+f.amount,0); }

/* materializa os gastos fixos como saída real de cada mês (do mês de início até o mês atual) */
function materializeFixos(){
  if(!S.fixos||!S.fixos.length)return false;
  const have=new Set(S.transactions.map(t=>t.extId).filter(Boolean));
  (S.deletedExt||[]).forEach(x=>have.add(x));
  const now=new Date(), curY=now.getFullYear(), curM=now.getMonth();
  let added=0;
  S.fixos.forEach(f=>{
    if(f.active===false)return;
    const [sy,sm]=(f.since||ym(now)).split('-').map(Number);
    let y=sy, m=(sm||1)-1;
    while(y<curY || (y===curY && m<=curM)){
      const key=`fixo:${f.id}:${y}-${String(m+1).padStart(2,'0')}`;
      if(!have.has(key)){
        const day=Math.min(Math.max(f.day||1,1),28);
        const date=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        S.transactions.push({id:uid(),extId:key,type:'expense',amount:f.amount,desc:f.name,
          categoryId:f.categoryId||null,date,account:f.card?null:(f.account||(S.accounts[0]&&S.accounts[0].id)||null),card:f.card||null,subId:null,fixo:true});
        have.add(key); added++;
      }
      m++; if(m>11){m=0;y++;}
    }
  });
  if(added)save();
  return added>0;
}

/* materializa as receitas recorrentes como entrada em conta de cada mês */
function materializeRenda(){
  if(!S.renda||!S.renda.length)return false;
  const have=new Set(S.transactions.map(t=>t.extId).filter(Boolean));
  (S.deletedExt||[]).forEach(x=>have.add(x));
  const now=new Date(), curY=now.getFullYear(), curM=now.getMonth();
  let added=0;
  S.renda.forEach(f=>{
    if(f.active===false)return;
    const acc=f.account||(S.accounts[0]&&S.accounts[0].id); if(!acc)return;
    const [sy,sm]=(f.since||ym(now)).split('-').map(Number);
    let y=sy, m=(sm||1)-1;
    while(y<curY || (y===curY && m<=curM)){
      const key=`renda:${f.id}:${y}-${String(m+1).padStart(2,'0')}`;
      if(!have.has(key)){
        const day=Math.min(Math.max(f.day||1,1),28);
        const date=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const cat=S.categories.find(c=>c.kind==='income'&&c.name==='Salário')?.id||S.categories.find(c=>c.kind==='income'&&c.name==='Outros')?.id||null;
        S.transactions.push({id:uid(),extId:key,type:'income',amount:f.amount,desc:f.name,categoryId:cat,date,account:acc,card:null,subId:null,fixo:true});
        have.add(key); added++;
      }
      m++; if(m>11){m=0;y++;}
    }
  });
  if(added)save();
  return added>0;
}
function rendaMensal(){ return (S.renda||[]).filter(f=>f.active!==false).reduce((a,f)=>a+f.amount,0); }

/* verifica se já existe um lançamento equivalente (valor + data próxima + nome parecido) */
function isDuplicate(amount,dateStr,desc,type,list,src){
  const d0=parseD(dateStr||todayStr()).getTime();
  const nd=normName(desc);
  const cents=Math.round((amount||0)*100);
  return (list||S.transactions).some(t=>{
    if(t.previsto)return false;
    if(t.type!==type)return false;
    if(src){ const ts=t.card?'card':'account'; if(ts!==src)return false; }
    if(Math.round(t.amount*100)!==cents)return false;
    const dd=Math.abs(parseD(t.date).getTime()-d0)/86400000;
    if(dd>3)return false;
    const tn=normName(t.desc);
    if(!nd||!tn)return true; // sem nome dos dois lados: casa por valor+data
    if(tn===nd||tn.includes(nd)||nd.includes(tn))return true;
    // correspondência forte: >=2 palavras significativas em comum e >=60% de sobreposição
    const aw=tn.split(' ').filter(w=>w.length>2);
    const bw=nd.split(' ').filter(w=>w.length>2);
    if(!aw.length||!bw.length)return false;
    const bs=new Set(bw);
    const shared=aw.filter(w=>bs.has(w)).length;
    return shared>=2 && shared/Math.min(aw.length,bw.length)>=0.6;
  });
}

const sameMonth=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth();

const mShort=d=>new Intl.DateTimeFormat('pt-BR',{month:'short'}).format(d).replace('.','');

function forecastData(){
  const n=ui.horizon||6;
  const base=new Date();base.setDate(1);
  const subsMonthly=S.subscriptions.filter(s=>s.active!==false).reduce((a,s)=>a+monthlyCost(s),0);
  const fxMonthly=fixosMensal();
  const rdMonthly=rendaMensal();
  let proj=carriedBalance(sod(new Date(Date.now()+86400000))); // dinheiro em caixa hoje
  const out=[];
  for(let i=0;i<n;i++){
    const d=new Date(base.getFullYear(),base.getMonth()+i,1);
    const items=S.transactions.filter(t=>t.previsto&&sameMonth(parseD(t.date),d)).sort((a,b)=>b.amount-a.amount);
    const parcelas=items.reduce((a,t)=>a+t.amount,0);
    const fixos = i===0 ? 0 : fxMonthly;
    const renda = i===0 ? 0 : rdMonthly;
    const total=parcelas+subsMonthly+fixos;
    if(i>0) proj = proj + renda - total; // saldo projetado ao fim do mês
    out.push({d,items,parcelas,assin:subsMonthly,fixos,renda,total,projCash:proj});
  }
  return out;
}

const scrim=$('#scrim'),sheet=$('#sheet');
let _savedScroll=0;
function lockBody(){
  _savedScroll=window.scrollY||document.documentElement.scrollTop||0;
  document.body.style.position='fixed';
  document.body.style.top=(-_savedScroll)+'px';
  document.body.style.left='0'; document.body.style.right='0'; document.body.style.width='100%';
}
function unlockBody(){
  document.body.style.position=''; document.body.style.top=''; document.body.style.left=''; document.body.style.right=''; document.body.style.width='';
  window.scrollTo(0,_savedScroll);
}
function openSheet(html){
  const wasOpen=scrim.classList.contains('open');
  let title='';
  const m=html.match(/^\s*<h2[^>]*>([\s\S]*?)<\/h2>/);
  if(m){ title=m[1]; html=html.slice(m[0].length); }
  sheet.innerHTML='<div class="sheet-top"><button class="sheet-back" id="sheetBack" aria-label="Voltar">'+svgIcon('back',18)+'</button><div class="sheet-title">'+title+'</div></div>'+html;
  if(!wasOpen)lockBody();
  scrim.classList.add('open');
  const b=sheet.querySelector('#sheetBack'); if(b)b.onclick=closeSheet;
  sheet.scrollTop=0;
}
function closeSheet(){ if(scrim.classList.contains('open'))unlockBody(); scrim.classList.remove('open'); }
scrim.onclick=e=>{if(e.target===scrim)closeSheet();};

function catOptions(kind,sel){return S.categories.filter(c=>c.kind===kind).map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('');}

function openTransfer(){
  const opts=`<optgroup label="Contas">${S.accounts.map(a=>`<option value="acc:${a.id}">${esc(a.name)}</option>`).join('')}</optgroup><optgroup label="Cofrinho"><option value="cofrinho">Cofrinho</option></optgroup>`;
  const opts2=`<optgroup label="Contas">${S.accounts.map((a,i)=>`<option value="acc:${a.id}" ${i===1?'selected':''}>${esc(a.name)}</option>`).join('')}</optgroup><optgroup label="Cofrinho"><option value="cofrinho" ${S.accounts.length<2?'selected':''}>Cofrinho</option></optgroup>`;
  openSheet(`<h2>Transferência</h2>
    <div class="field"><label>De</label><select id="trFrom">${opts}</select></div>
    <div class="field"><label>Para</label><select id="trTo">${opts2}</select></div>
    <div class="row2">
      <div class="field"><label>Valor</label><input id="trAmt" type="number" step="0.01" inputmode="decimal" placeholder="0,00"></div>
      <div class="field"><label>Data</label><input id="trDate" type="date" value="${todayStr()}"></div>
    </div>
    <div class="sheet-actions"><button class="btn ghost" id="trCancel">Cancelar</button><button class="btn" id="trOk">Transferir</button></div>
    <p class="hint">Transferência não conta como gasto nem receita. Mover para o cofrinho sai do "Em caixa"; resgatar volta pro caixa.</p>`);
  $('#trCancel').onclick=closeSheet;
  $('#trOk').onclick=()=>{
    const from=$('#trFrom').value, to=$('#trTo').value, amt=Math.abs(parseFloat($('#trAmt').value)||0), date=$('#trDate').value||todayStr();
    if(!amt){$('#trAmt').focus();return;}
    if(from===to){alert('Escolha origem e destino diferentes.');return;}
    if(!S.cofrinho)S.cofrinho={deposits:[],metaMes:0,metaSemestre:0,metaAno:0};
    const accName=id=>accById(id)?.name||'conta';
    const tid=uid();
    if(from.startsWith('acc:')&&to.startsWith('acc:')){
      const s=from.slice(4),d=to.slice(4);
      S.transactions.push({id:uid(),type:'expense',amount:amt,desc:'Transferência para '+accName(d),categoryId:null,date,account:s,card:null,subId:null,transfer:true,transferId:tid});
      S.transactions.push({id:uid(),type:'income',amount:amt,desc:'Transferência de '+accName(s),categoryId:null,date,account:d,card:null,subId:null,transfer:true,transferId:tid});
    } else if(from.startsWith('acc:')&&to==='cofrinho'){
      S.transactions.push({id:uid(),type:'expense',amount:amt,desc:'Transferência para cofrinho',categoryId:null,date,account:from.slice(4),card:null,subId:null,transfer:true,transferId:tid});
      S.cofrinho.deposits.push({id:uid(),date,amount:amt,transferId:tid});
    } else if(from==='cofrinho'&&to.startsWith('acc:')){
      S.transactions.push({id:uid(),type:'income',amount:amt,desc:'Resgate do cofrinho',categoryId:null,date,account:to.slice(4),card:null,subId:null,transfer:true,transferId:tid});
      S.cofrinho.deposits.push({id:uid(),date,amount:-amt,transferId:tid});
    } else { alert('Transferência inválida.'); return; }
    save(); closeSheet(); render();
  };
}
function deleteTransfer(tid){
  if(!tid)return;
  S.transactions=S.transactions.filter(x=>x.transferId!==tid);
  if(S.cofrinho&&Array.isArray(S.cofrinho.deposits)) S.cofrinho.deposits=S.cofrinho.deposits.filter(d=>d.transferId!==tid);
  save(); closeSheet(); render();
}

function openPayInvoice(cardId){
  const c=cardById(cardId); if(!c)return;
  const items=S.transactions.filter(t=>t.card===c.id&&t.type==='expense'&&!t.paid&&!t.previsto);
  const total=items.reduce((s,t)=>s+t.amount,0);
  if(total<=0){alert('Não há fatura em aberto neste cartão.');return;}
  if(!S.accounts.length){alert('Cadastre uma conta antes de pagar a fatura.');return;}
  const contasCat=S.categories.find(x=>x.kind==='expense'&&x.name==='Contas')?.id;
  openSheet(`<h2>Pagar fatura · ${esc(c.name)}</h2>
    <div class="subtotal"><div><div style="font-size:12px;color:var(--muted);font-weight:600">Fatura aberta</div>

      <div class="v num" style="color:var(--neg)">${brl(total)}</div></div>
    <div class="field"><label>Pagar com (conta)</label><select id="pfAcc">${accOptions(S.accounts[0]&&S.accounts[0].id)}</select></div>
    <div class="field"><label>Data do pagamento</label><input id="pfDate" type="date" value="${todayStr()}"></div>
    <p class="hint">Cria uma saída em conta (dinheiro saindo do caixa) e marca os lançamentos desta fatura como pagos — assim o gasto do cartão não é contado duas vezes.</p>
    <div class="sheet-actions"><button class="btn ghost" id="pfCancel">Cancelar</button><button class="btn" id="pfOk">Pagar ${brl(total)}</button></div>`);
  $('#pfCancel').onclick=()=>openCardDetail(cardId);
  $('#pfOk').onclick=()=>{
    const accId=$('#pfAcc').value, date=$('#pfDate').value||todayStr();
    const payId=uid();
    items.forEach(t=>{t.paid=true;t.faturaPagaId=payId;});
    S.transactions.push({id:uid(),type:'expense',amount:total,desc:'Pagamento fatura '+c.name,categoryId:contasCat||null,date,account:accId,card:null,subId:null,faturaOf:c.id,faturaPagaId:payId});
    save(); closeSheet(); render();
    alert('Fatura paga: '+brl(total)+'. Saiu do caixa uma vez.');
  };
}

function bumpUse(id){ if(!MENU_POOL.includes(id))return; S.menuUse=S.menuUse||{}; S.menuUse[id]=(S.menuUse[id]||0)+1; save(); }
// destaques = 6 posições (padrão), onde uma função com ≥3 usos substitui a menos usada atual
function computeHighlights(){
  const use=id=>(S.menuUse&&S.menuUse[id])||0;
  const hi=[...MENU_DEFAULT];
  const cands=MENU_EXTRA.filter(id=>use(id)>=3).sort((a,b)=>use(b)-use(a));
  cands.forEach(id=>{
    // acha o destaque atual menos usado (desempate: posição mais à direita)
    let idx=0, minU=use(hi[0]);
    for(let i=1;i<hi.length;i++){ if(use(hi[i])<=minU){minU=use(hi[i]);idx=i;} }
    if(use(id)>minU) hi[idx]=id;
  });
  return hi;
}

function semesterRange(ref){ const d=ref||new Date(); const y=d.getFullYear(); const h=d.getMonth()<6?0:6; return {start:sod(new Date(y,h,1)),end:eod(new Date(y,h+6,0))}; }
function openCofrinho(){
  const cof=S.cofrinho||{deposits:[],metaMes:0,metaSemestre:0,metaAno:0};
  const dep=cof.deposits||[];
  const total=dep.reduce((a,d)=>a+d.amount,0);
  const now=new Date();
  const inRange=(r)=>dep.filter(d=>{const x=parseD(d.date);return x>=r.start&&x<=r.end;}).reduce((a,d)=>a+d.amount,0);
  const savedMes=inRange(range('month',now)), savedSem=inRange(semesterRange(now)), savedAno=inRange(range('year',now));
  // ritmo médio: depósitos líquidos dos últimos 90 dias / 3 meses
  const d90=new Date(now.getTime()-90*86400000);
  const pace=dep.filter(d=>parseD(d.date)>=d90).reduce((a,d)=>a+d.amount,0)/3;
  const proj=(saved,meta)=>{ if(!meta||saved>=meta)return ''; if(pace<=0)return `<p class="hint" style="margin:6px 2px 0">Sem depósitos recentes para estimar o ritmo.</p>`;
    const meses=Math.ceil((meta-saved)/pace);
    return `<p class="hint" style="margin:6px 2px 0">No seu ritmo (${brl(pace)}/mês), você alcança esta meta em ~${meses} ${meses===1?'mês':'meses'}.</p>`; };
  const bar=(saved,meta)=>{ if(!meta)return `<div class="meta">${brl(saved)} guardado (sem meta)</div>`;
    const pct=Math.max(0,Math.min(saved/meta*100,100)), done=saved>=meta;
    return `<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span>${brl(saved)} de ${brl(meta)}</span><span class="num" style="color:${done?'var(--pos)':'var(--muted)'}">${Math.round(pct)}%</span></div><div class="bar-mini"><span style="width:${pct}%;background:${done?'var(--pos)':'var(--accent)'}"></span></div>`; };
  const depRows=[...dep].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,20).map(d=>`<div class="tx" data-depdel="${d.id}" style="padding:10px 2px">
    <div class="mid"><div class="d">Depósito</div><div class="m">${new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short',year:'numeric'}).format(parseD(d.date))}</div></div>
    <div class="amt num" style="color:var(--pos)">+ ${brl(d.amount)}</div></div>`).join('')||emptyInline('Nenhum depósito ainda');
  openSheet(`<h2>Cofrinho</h2>
    <section class="card hero" style="padding:18px;margin-bottom:12px">
      <div class="cap">Total guardado</div>
      <div class="bal num pos">${brl(total)}</div>
    </section>
    <div class="sec-h" style="margin:4px 2px 6px"><h2 style="font-size:13px">Este mês</h2></div>
    <section class="card" style="padding:12px 16px">${bar(savedMes,cof.metaMes)}</section>
    <div class="sec-h" style="margin:12px 2px 6px"><h2 style="font-size:13px">Este semestre</h2></div>
    <section class="card" style="padding:12px 16px">${bar(savedSem,cof.metaSemestre)}</section>
    <div class="sec-h" style="margin:12px 2px 6px"><h2 style="font-size:13px">Este ano</h2></div>
    <section class="card" style="padding:12px 16px">${bar(savedAno,cof.metaAno)}${proj(savedAno,cof.metaAno)}</section>
    <div class="sheet-actions" style="margin-top:14px"><button class="btn ghost" id="cofMetas">Definir metas</button><button class="btn" id="cofAdd">+ Guardar</button></div>
    <div class="sec-h" style="margin:16px 2px 6px"><h2 style="font-size:13px">Depósitos</h2></div>
    <section class="card" style="padding:4px 16px"><div class="list">${depRows}</div></section>
    <button class="btn ghost block" id="cofBack" style="margin-top:12px">Voltar</button>
    <p class="hint" style="margin-top:10px">O cofrinho é um acompanhamento à parte — registra o quanto você guardou. Não desconta do "Em caixa" automaticamente.</p>`);
  $('#cofBack').onclick=openMenu;
  $('#cofAdd').onclick=openCofrinhoAdd;
  $('#cofMetas').onclick=openCofrinhoMetas;
  $$('[data-depdel]').forEach(el=>el.onclick=()=>{
    const d=(S.cofrinho.deposits||[]).find(x=>x.id===el.dataset.depdel);
    if(d&&d.transferId){ if(!confirm('Este valor veio de uma transferência. Remover a transferência inteira (volta pro caixa)?'))return;
      S.transactions=S.transactions.filter(x=>x.transferId!==d.transferId);
      S.cofrinho.deposits=S.cofrinho.deposits.filter(x=>x.transferId!==d.transferId);
      save(); openCofrinho(); return; }
    if(!confirm('Remover este depósito do cofrinho?'))return;
    S.cofrinho.deposits=S.cofrinho.deposits.filter(x=>x.id!==el.dataset.depdel); save(); openCofrinho();
  });
}

// lembretes recorrentes locais: fatura fechando/vencendo e gastos fixos vencendo
function localReminders(){
  if(S.notifOff)return [];
  const out=[], today=new Date(); today.setHours(0,0,0,0);
  const dUntil=day=>{let d=new Date(today.getFullYear(),today.getMonth(),Math.min(day,28));if(d<today)d=new Date(today.getFullYear(),today.getMonth()+1,Math.min(day,28));return Math.round((d-today)/86400000);};
  const payDay=(()=>{const v=parseInt(S.payDay);return Number.isFinite(v)&&v>=1&&v<=28?v:0;})();
  S.cards.forEach(c=>{
    if(c.closingDay){const dd=dUntil(c.closingDay); if(dd<=3)out.push({kind:'fatura_fecha',card:c,dias:dd});}
    const inv=cardInvoice(c); if(!(inv>0))return;
    if(payDay){
      const closed=!c.closingDay||c.closingDay<=payDay;
      if(closed){ const dp=dUntil(payDay); if(dp<=3){ let note=''; if(c.dueDay&&c.dueDay>payDay)note='ainda não venceu (vence dia '+c.dueDay+')'; else if(c.dueDay&&c.dueDay<payDay)note='venceu dia '+c.dueDay; out.push({kind:'fatura_vence',card:c,amount:inv,dias:dp,pay:true,note}); } }
      else if(c.dueDay){ const dd=dUntil(c.dueDay); if(dd<=5)out.push({kind:'fatura_vence',card:c,amount:inv,dias:dd}); }
    } else if(c.dueDay){ const dd=dUntil(c.dueDay); if(dd<=5)out.push({kind:'fatura_vence',card:c,amount:inv,dias:dd}); }
  });
  (S.fixos||[]).filter(f=>f.active!==false).forEach(f=>{
    if(payDay){ const dp=dUntil(payDay); if(dp<=3)out.push({kind:'fixo_vence',fixo:f,amount:f.amount,dias:dp,pay:true,note:(f.day&&f.day>payDay)?('vence dia '+f.day):''}); }
    else { const dd=dUntil(f.day||1); if(dd<=3)out.push({kind:'fixo_vence',fixo:f,amount:f.amount,dias:dd}); }
  });
  out.sort((a,b)=>a.dias-b.dias);
  return out;
}

function networthBreakdown(D){
  const t0=D.getTime(); let cash=S.accounts.reduce((a,ac)=>a+(ac.opening||0),0),cardDebt=0,cof=0;
  S.transactions.forEach(t=>{const d=parseD(t.date).getTime();if(d>t0)return; if(t.card){if(t.type==='expense')cardDebt+=t.amount;} else if(t.account){cash+=t.type==='income'?t.amount:-t.amount; if(t.faturaOf)cardDebt-=t.amount;}});
  (S.cofrinho&&S.cofrinho.deposits||[]).forEach(dp=>{if(parseD(dp.date).getTime()<=t0)cof+=dp.amount;});
  cardDebt=Math.max(cardDebt,0);
  return {cash,cof,cardDebt,net:cash+cof-cardDebt};
}

/* ---------- PDF -> imagens (lê todas as páginas, inclusive faturas grandes) ---------- */
async function pdfToImages(dataUrl, maxPages=16){
  if(!window.pdfjsLib)throw new Error('pdfjs indisponível');
  try{ pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }catch(e){}
  const b64=(dataUrl.split(',')[1])||dataUrl;
  const bin=atob(b64); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  const pdf=await pdfjsLib.getDocument({data:bytes}).promise;
  const n=Math.min(pdf.numPages,maxPages);
  // quanto mais páginas, menor a resolução (p/ caber no tempo do servidor)
  const targetW = n>10 ? 720 : (n>5 ? 840 : 960);
  const quality = n>10 ? 0.55 : 0.6;
  const imgs=[];
  for(let p=1;p<=n;p++){
    const page=await pdf.getPage(p);
    const base=page.getViewport({scale:1});
    const scale=Math.min(1.5, targetW/base.width);
    const vp=page.getViewport({scale});
    const canvas=document.createElement('canvas'); canvas.width=Math.round(vp.width); canvas.height=Math.round(vp.height);
    await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
    imgs.push(canvas.toDataURL('image/jpeg',quality).split(',')[1]);
    canvas.width=canvas.height=0;
    const st=$('#readProg'); if(st)st.textContent=`Preparando página ${p} de ${n}…`;
  }
  return imgs;
}
// remove lixo antes do %PDF- e depois do %%EOF (alguns apps exportam PDF corrompido com bytes nulos no início)
function sanitizePdfB64(dataUrl){
  let b64=(dataUrl.split(',')[1])||dataUrl;
  try{
    const bin=atob(b64);
    const start=bin.indexOf('%PDF-');
    if(start<0)return b64;
    let end=bin.lastIndexOf('%%EOF');
    end=end<0?bin.length:end+5;
    if(start===0&&end>=bin.length-2)return b64;
    return btoa(bin.slice(start,end));
  }catch(e){ return b64; }
}
// lê fatura/extrato: tenta o PDF limpo (rápido); se falhar, cai para páginas em imagens
async function parseDocument(dataUrl, tipo){
  const clean=sanitizePdfB64(dataUrl);
  const categorias=S.categories.filter(c=>c.kind==='expense').map(c=>c.name);
  const send=async(payload)=>{
    payload.categorias=categorias;
    const r=await fetch(apiBase()+'/api/parse-fatura',{method:'POST',headers:await authHeaders(),body:JSON.stringify(payload)});
    const raw=await r.text(); let d; try{d=JSON.parse(raw);}catch{d=null;}
    return {r,d};
  };
  let {r,d}=await send(tipo==='extrato'?{pdf:clean,tipo:'extrato'}:{pdf:clean});
  if(r.ok&&d)return d;
  // fallback: converte páginas em imagens (ajuda em PDFs que a IA não lê direto)
  const pr=$('#readProg'); if(pr)pr.textContent='Tentando outra forma de leitura…';
  try{
    const imgs=await pdfToImages('data:application/pdf;base64,'+clean);
    if(imgs&&imgs.length){ const res=await send(tipo==='extrato'?{images:imgs,tipo:'extrato'}:{images:imgs}); if(res.r.ok&&res.d)return res.d; r=res.r; d=res.d; }
  }catch(e){}
  const msg=(d&&d.error)||(r.status>=500?'o servidor demorou ou a IA está ocupada. Tente de novo em instantes.':'resposta inesperada do servidor ('+r.status+')');
  throw new Error(msg);
}

function applyExtrato(movs,suggested){
  const accId=resolveAccount($('#eAcc').value,suggested);
  const outOther=S.categories.find(c=>c.kind==='expense'&&c.name==='Outros')?.id;
  const inOther=S.categories.find(c=>c.kind==='income'&&c.name==='Outros')?.id;
  const have=new Set(S.transactions.map(t=>t.extId).filter(Boolean));
  (S.deletedExt||[]).forEach(x=>have.add(x));
  const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,22);
  const assinCat=S.categories.find(c=>c.kind==='expense'&&c.name==='Assinaturas')?.id;
  const existing=S.transactions.slice(); // valida contra o que já existia antes desta importação
  let n=0, subN=0, dupN=0;
  movs.forEach(m=>{
    const date=m.data||todayStr();
    const isIn=m.tipo==='entrada';
    const type=isIn?'income':'expense';
    if(isDuplicate(m.valor,date,m.descricao,type,existing,'account')){dupN++;return;}
    let subId=null;

      const d=parseD(date);

    }
    const extId=`ext:${accId}:${date}:${Math.round(m.valor*100)}:${isIn?'i':'o'}:${slug(m.descricao)}`;
    if(have.has(extId))return;
    const cat=isIn?inOther:resolveCat(m.descricao,m.categoria,m.assinatura,assinCat,outOther);
    S.transactions.push({id:uid(),extId,type,amount:m.valor,desc:m.descricao,categoryId:cat,date,account:accId,card:null,subId});
    have.add(extId);n++;
  });

  alert(msg);
}

  const suggested = emissor ? (emissor + (final?` ••${final}`:'')) : 'Cartão de crédito';
  const matched = findCardByName(suggested) || (emissor?findCardByName(emissor):null);
  const totalMes=compras.reduce((s,c)=>s+c.valor_parcela,0);
  const parceladas=compras.filter(c=>c.parcelas_total>1).length;
  const rows=compras.map((c)=>`<div class="tx" style="padding:10px 2px">
    <div class="mid"><div class="d">${esc(c.descricao)}${c.parcelas_total>1?`<span class="tag">${c.parcela_atual}/${c.parcelas_total}</span>`:''}</div>
      <div class="m">${c.data?new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short'}).format(parseD(c.data)).replace('.',''):'—'}${c.parcelas_total>1?' · total '+brl(c.valor_total):''}</div></div>
    <div class="amt num out">${brl(c.valor_parcela)}</div></div>`).join('');
  const cardSel=`<select id="fCard">
    <option value="new" ${matched?'':'selected'}>+ Novo cartão: ${esc(suggested)}</option>
    ${S.cards.map(c=>`<option value="${c.id}" ${matched&&matched.id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
  </select>`;
  const detected = emissor ? `${esc(emissor)}${final?' ••'+final:''}${bandeira?' · '+esc(bandeira):''}` : 'não identificado';
  openSheet(`<h2>Fatura · ${compras.length} compras</h2>
    <div class="callout" style="margin-bottom:14px;display:flex;align-items:center;gap:10px">
      ${svgIcon('card',18)}
      <div>Cartão detectado: <b style="color:var(--ink)">${detected}</b>${matched?' <span class="tag">já cadastrado</span>':' <span class="tag">novo</span>'}</div>
    </div>
    <div class="row2">
      <div class="field"><label>Mês de referência</label><input id="fRef" type="month" value="${refMonth}"></div>
      <div class="field"><label>Lançar no cartão</label>${cardSel}</div>
    </div>
    <div class="subtotal"><div><div style="font-size:12px;color:var(--muted);font-weight:600">parcelas deste mês</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">${parceladas} compra(s) parcelada(s)</div></div>
      <div class="v num" style="color:var(--neg)">${brl(totalMes)}</div></div>
    <div style="max-height:32vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:2px 12px;margin-bottom:8px">${rows}</div>
    <p class="hint">A parcela deste mês vira gasto normal; as futuras viram <b>previsto</b>. Se o cartão for novo, ele é criado automaticamente. Os lançamentos aparecem todos juntos; a separação por cartão fica na aba Contas.</p>
    <div class="sheet-actions"><button class="btn ghost" id="fCancel">Cancelar</button><button class="btn" id="fImport">Importar</button></div>`);
  $('#fCancel').onclick=closeSheet;
  $('#fImport').onclick=()=>applyFatura(compras,suggested,vencimento);
}

function resolveCard(sel,suggested,vencimento){
  if(sel&&sel!=='new'){ const c=cardById(sel); if(c)return c.id; }
  let card=findCardByName(suggested);
  if(!card){
    const dueDay = vencimento&&/^\d{4}-\d{2}-(\d{2})/.test(vencimento)?parseInt(vencimento.slice(8,10)):null;
    card={id:uid(),name:suggested||'Cartão de crédito',limit:0,closingDay:1,dueDay,color:PALETTE[(S.cards.length+1)%PALETTE.length]};
    S.cards.push(card);
  }
  return card.id;
}

function ensureSubscription(name,amount,ry,rm){
  const assinCat=S.categories.find(c=>c.kind==='expense'&&c.name==='Assinaturas')?.id;
  const existing=S.subscriptions.find(s=>normName(s.name)===normName(name));
  if(existing){ existing.active=true; if(amount)existing.amount=amount; return {id:existing.id,created:false}; }
  const nd=new Date(ry,rm,1); // mês seguinte ao de referência
  const nextDate=`${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}-01`;
  const sub={id:uid(),name:name||'Assinatura',amount:amount||0,freq:'monthly',categoryId:assinCat,nextDate,active:true};
  S.subscriptions.push(sub);
  return {id:sub.id,created:true};
}

function applyFatura(compras,suggested,vencimento){
  const refStr=$('#fRef').value||monthValue(null);
  const [ry,rm]=refStr.split('-').map(Number);
  const cardId=resolveCard($('#fCard').value,suggested,vencimento);
  const outOther=S.categories.find(c=>c.kind==='expense'&&c.name==='Outros')?.id;
  const assinCat=S.categories.find(c=>c.kind==='expense'&&c.name==='Assinaturas')?.id;
  const have=new Set(S.transactions.map(t=>t.extId).filter(Boolean));
  (S.deletedExt||[]).forEach(x=>have.add(x));
  const existing=S.transactions.slice();
  const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,18);
  let realN=0, prevN=0, subN=0, dupN=0;
  compras.forEach(c=>{
    const day = c.data&&/^\d{4}-\d{2}-(\d{2})/.test(c.data) ? parseInt(c.data.slice(8,10)) : 1;
    const isSub = !!c.assinatura;
    let subId=null;
    if(isSub){ const r=ensureSubscription((c.servico||c.descricao||'Assinatura').trim(),c.valor_parcela,ry,rm); subId=r.id; if(r.created)subN++; }
    const cat = resolveCat(c.descricao, c.categoria, isSub, assinCat, outOther);
    const total=c.parcelas_total||1, atual=c.parcela_atual||1;
    for(let k=atual;k<=total;k++){
      const off=k-atual;
      const d=new Date(ry, (rm-1)+off, Math.min(day,28));
      const date=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const previsto = off>0;
      const extId=`fat:${cardId}:${slug(c.descricao)}:${total}:${Math.round(c.valor_parcela*100)}:${ry}-${rm}:${k}`;
      if(have.has(extId))continue;
      if(!previsto && isDuplicate(c.valor_parcela,date,c.descricao,'expense',existing,'card')){dupN++;continue;}
      S.transactions.push({id:uid(),extId,type:'expense',amount:c.valor_parcela,
        desc:c.descricao+(total>1?` (${k}/${total})`:''),categoryId:cat,date,
        account:null,card:cardId,subId,previsto});
      have.add(extId); previsto?prevN++:realN++;
    }
  });
  save();render();
  const cardName=cardById(cardId)?.name||'cartão';
  let msg=`Importado em "${cardName}": ${realN} lançamento(s) deste mês · ${prevN} parcela(s) futura(s).`;
  if(dupN)msg+=`\n${dupN} ignorada(s) por já existirem.`;
  if(subN)msg+=`\n${subN} assinatura(s) detectada(s) na aba Recorrentes.`;
  importFaturaDone(cardId,msg);
}
function importFaturaDone(cardId,msg){
  const c=cardById(cardId); const open=c?cardInvoice(c):0;
  openSheet(`<h2>Fatura importada</h2>
    <p style="font-size:14px;line-height:1.55;white-space:pre-wrap">${esc(msg)}</p>
    ${open>0?`<div class="subtotal" style="margin-top:10px"><div><div style="font-size:12px;color:var(--muted);font-weight:600">Em aberto neste cartão</div></div><div class="v num" style="color:var(--neg)">${brl(open)}</div></div>
    <p class="hint">Quer registrar o pagamento desta fatura agora? Isso cria a saída em conta e marca os lançamentos como pagos (sem contar duas vezes).</p>`:''}
    <div class="sheet-actions" style="margin-top:12px">
      ${open>0?`<button class="btn" id="ifPay">Pagar fatura agora</button>`:''}
      <button class="btn ghost" id="ifCard">Ver cartão</button>
      <button class="btn ghost" id="ifClose">Fechar</button>
    </div>`);
  const pb=$('#ifPay'); if(pb)pb.onclick=()=>openPayInvoice(cardId);
  $('#ifCard').onclick=()=>openCardDetail(cardId);
  $('#ifClose').onclick=closeSheet;
}
function importStatement(text,name){
  let added=0; const acc=S.accounts[0]?.id;
  const outCat=S.categories.find(c=>c.kind==='expense'&&c.name==='Outros')?.id;
  const inCat=S.categories.find(c=>c.kind==='income'&&c.name==='Outros')?.id;
  if(/\.ofx$/i.test(name)||/<OFX>/i.test(text)){
    const trns=text.split(/<STMTTRN>/i).slice(1);
    trns.forEach(blk=>{
      const amt=parseFloat((blk.match(/<TRNAMT>([^<\r\n]+)/i)||[])[1]);
      const dt=(blk.match(/<DTPOSTED>(\d{4})(\d{2})(\d{2})/i)||[]);
      const memo=(blk.match(/<MEMO>([^<\r\n]+)/i)||[])[1]||'';
      if(!isNaN(amt)&&dt[1]){
        S.transactions.push({id:uid(),type:amt<0?'expense':'income',amount:Math.abs(amt),desc:memo.trim(),categoryId:amt<0?outCat:inCat,date:`${dt[1]}-${dt[2]}-${dt[3]}`,account:acc,card:null,subId:null});added++;
      }
    });
  } else {
    const lines=text.split(/\r?\n/).filter(l=>l.trim());
    const sep=lines[0].includes(';')?';':',';
    lines.forEach((l,i)=>{
      const parts=l.split(sep).map(s=>s.replace(/^"|"$/g,'').trim());
      if(parts.length<3)return;
      // heuristics: find date, value
      let date=null,val=null,desc='';
      parts.forEach(p=>{
        const dm=p.match(/(\d{2})\/(\d{2})\/(\d{4})/)||p.match(/(\d{4})-(\d{2})-(\d{2})/);
        if(dm&&!date){ date= dm[3].length===4?`${dm[3]}-${dm[2]}-${dm[1]}`:`${dm[1]}-${dm[2]}-${dm[3]}`; }
      });
      const vm=parts.map(p=>p.replace(/[R$\s.]/g,'').replace(',','.')).map(parseFloat).filter(n=>!isNaN(n));
      if(vm.length){val=vm[vm.length-1];}
      desc=parts.find(p=>!/^\d/.test(p)&&p.length>2)||'Importado';
      if(date&&val!=null&&i>0){ // skip header row
        S.transactions.push({id:uid(),type:val<0?'expense':'income',amount:Math.abs(val),desc,categoryId:val<0?outCat:inCat,date,account:acc,card:null,subId:null});added++;
      }
    });
  }
  save();closeSheet();render();
  alert(added?`${added} lançamentos importados. Revise as categorias quando puder.`:'Não encontrei transações legíveis. Me manda um exemplo do arquivo no chat que eu ajusto a importação.');
}

/* ---------- PWA: instalação, service worker, notificações ---------- */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{});}); }
async function installApp(){
  closeSheet();
  if(deferredPrompt){ deferredPrompt.prompt(); try{await deferredPrompt.userChoice;}catch(e){} deferredPrompt=null; return; }
  alert('Para instalar:\n\n• Android/Chrome: menu do navegador (⋮) → "Instalar app" ou "Adicionar à tela inicial".\n• iPhone/Safari: botão Compartilhar → "Adicionar à Tela de Início".');
}
const VAPID_PUBLIC='BLGt3ygONScU7g5bslwmM8crduxB6ZLkPGBWR9uHHL_2yGrh68TUvoq5s3H-H0dX5rnxRJJQfgGzXLZmfGLcYRg';
function urlB64ToU8(b64){ const pad='='.repeat((4-b64.length%4)%4); const s=(b64+pad).replace(/-/g,'+').replace(/_/g,'/'); const raw=atob(s); const a=new Uint8Array(raw.length); for(let i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i); return a; }
async function enableNotifications(){
  closeSheet();
  if(!('Notification' in window)){ alert('Seu navegador não suporta notificações.'); return; }
  let p=Notification.permission;
  if(p!=='granted') p=await Notification.requestPermission();
  if(p!=='granted'){ alert('Permissão de notificação não concedida.'); return; }
  // notificações locais (app aberto) já funcionam
  maybeNotify(true);
  // push real (app fechado): precisa de login + service worker + assinatura
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){ alert('Notificações locais ativadas. (Este navegador não suporta push com o app fechado.)'); return; }
  if(!sb||!authUser){ alert('Notificações locais ativadas. Para receber avisos com o app FECHADO, entre com o Google e ative de novo.'); return; }
  try{
    const reg=await navigator.serviceWorker.ready;
    // descarta qualquer assinatura antiga (pode estar expirada / com chave diferente)
    let sub=await reg.pushManager.getSubscription();
    if(sub){ const oldEp=sub.endpoint; try{await sub.unsubscribe();}catch(_){}; try{ if(sb&&authUser)await sb.from('push_subscriptions').delete().eq('endpoint',oldEp); }catch(_){}; sub=null; }
    sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:urlB64ToU8(VAPID_PUBLIC)});
    const j=sub.toJSON();
    const {error}=await sb.from('push_subscriptions').upsert({user_id:authUser.id,endpoint:sub.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth},{onConflict:'endpoint'});
    if(error){ alert('Ativado localmente, mas não consegui salvar a assinatura de push: '+error.message); return; }
    try{
      const r=await fetch(apiBase()+'/api/push',{method:'POST',headers:await authHeaders(),body:JSON.stringify({action:'test',subscription:j})});
      const d=await r.json().catch(()=>null);
      alert(r.ok?'Notificações no celular ativadas! Você deve receber um teste agora.':'Ativado, mas o teste falhou: '+((d&&d.error)||('erro '+r.status)));
    }catch(e){ alert('Ativado. (teste não enviado agora: '+e.message+')'); }
  }catch(e){ alert('Notificações locais ativadas. Push com app fechado falhou: '+e.message); }
}
function maybeNotify(force){
  try{
    if(S.notifOff)return;
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    const alerts=computeAlerts(); if(!alerts.length)return;
    if(!force){ try{ if(localStorage.getItem('caixa.notif')===todayStr())return; }catch(e){} }
    try{localStorage.setItem('caixa.notif',todayStr());}catch(e){}
    new Notification('Caixa — avisos',{body:alerts.slice(0,4).join('\n'),icon:'/icon-192.png'});
  }catch(e){}
}
