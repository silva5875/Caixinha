<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1416">
<title>Caixa · controle de gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#f4f6f7; --surface:#ffffff; --surface-2:#eef2f3; --ink:#0f1c1f; --muted:#5b6b6e;
  --line:#e2e8e9; --line-strong:#cfd9da; --accent:#0b6e6e; --accent-ink:#ffffff;
  --pos:#1e8e5a; --neg:#c0453b; --pos-soft:#e4f3ea; --neg-soft:#f8e7e5;
  --shadow:0 1px 2px rgba(15,28,31,.06),0 8px 24px rgba(15,28,31,.06);
  --radius:16px; --radius-sm:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1416; --surface:#111e21; --surface-2:#16262a; --ink:#e8eeee; --muted:#93a3a4;
    --line:#223034; --line-strong:#2f4146; --accent:#2dd4bf; --accent-ink:#06211f;
    --pos:#34d399; --neg:#f87171; --pos-soft:#0f2b23; --neg-soft:#30191a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1416; --surface:#111e21; --surface-2:#16262a; --ink:#e8eeee; --muted:#93a3a4;
  --line:#223034; --line-strong:#2f4146; --accent:#2dd4bf; --accent-ink:#06211f;
  --pos:#34d399; --neg:#f87171; --pos-soft:#0f2b23; --neg-soft:#30191a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-feature-settings:"tnum" 1,"cv05" 1;
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:600}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select{font-family:inherit;font-size:16px}
.app{max-width:960px;margin:0 auto;padding:0 16px 120px}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 10px;position:sticky;top:env(safe-area-inset-top,0px);background:linear-gradient(var(--bg) 70%,transparent);z-index:20}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:"Space Grotesk";font-weight:700;font-size:17px}
.brand h1{font-size:19px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:-1px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:17px}
.iconbtn:active{transform:scale(.95)}
.topactions{display:flex;gap:8px}

/* period bar */
.periodbar{display:flex;flex-direction:column;gap:10px;margin:4px 0 16px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 0;border-radius:9px;font-size:13px;font-weight:600}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.navrow{display:flex;align-items:center;justify-content:space-between}
.navrow .lbl{font-family:"Space Grotesk";font-weight:600;font-size:16px;text-transform:capitalize}
.navrow .today{font-size:12px;color:var(--accent);background:transparent;border:0;font-weight:600;padding:6px 8px}
.chev{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--surface);display:grid;place-items:center;font-size:16px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero{padding:20px;margin-bottom:14px}
.hero .cap{font-size:12px;color:var(--muted);font-weight:600}
.hero .bal{font-family:"Space Grotesk";font-weight:700;letter-spacing:-.02em;font-size:40px;line-height:1.05;margin:6px 0 2px}
.hero .bal.pos{color:var(--pos)} .hero .bal.neg{color:var(--neg)}
.flows{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.flow{border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px}
.flow .t{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-weight:600}
.flow .v{font-family:"Space Grotesk";font-weight:600;font-size:19px;margin-top:4px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.flow.in .dot{background:var(--pos)} .flow.out .dot{background:var(--neg)}
.flow.in .v{color:var(--pos)} .flow.out .v{color:var(--neg)}

.sec-h{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 12px}
.sec-h h2{font-size:15px;letter-spacing:-.01em}
.sec-h .sub{font-size:12px;color:var(--muted)}
.link{color:var(--accent);background:0;border:0;font-weight:600;font-size:13px}

.chartcard{padding:18px}
.donutwrap{position:relative;height:210px;margin:4px auto 6px}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donut-center .c-cap{font-size:11px;color:var(--muted);font-weight:600}
.donut-center .c-val{font-family:"Space Grotesk";font-weight:700;font-size:22px;margin-top:2px}
.legend{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.legrow{display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:9px}
.legrow:active{background:var(--surface-2)}
.legrow .nm{flex:1;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legrow .pc{font-size:12px;color:var(--muted);width:42px;text-align:right}
.legrow .amt{font-weight:600;font-size:14px;min-width:84px;text-align:right}
.barwrap{height:220px;margin-top:6px}

/* lists */
.list{display:flex;flex-direction:column}
.tx{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.tx .mid{flex:1;min-width:0}
.tx .d{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .m{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .amt{font-weight:600;font-size:15px;white-space:nowrap}
.tx .amt.in{color:var(--pos)} .tx .amt.out{color:var(--ink)}
.tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted);margin-left:6px;vertical-align:middle}

.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:34px}
.empty h3{color:var(--ink);font-size:16px;margin:10px 0 4px}
.empty p{font-size:13px;margin:0 0 16px;line-height:1.5}

.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:600;font-size:14px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);border:1px solid var(--line-strong);color:var(--ink)}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.btn.sm{padding:8px 12px;font-size:13px}

/* account/card/sub rows */
.accrow{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line)}
.accrow:last-child{border-bottom:0}
.swatch{width:40px;height:40px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;color:#fff;font-weight:700;font-family:"Space Grotesk"}
.accrow .mid{flex:1;min-width:0}
.accrow .nm{font-weight:600;font-size:14px}
.accrow .meta{font-size:12px;color:var(--muted);margin-top:2px}
.accrow .right{text-align:right}
.accrow .right .v{font-weight:600;font-size:15px}
.bar-mini{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.bar-mini span{display:block;height:100%;border-radius:4px;background:var(--accent)}
.bar-mini span.warn{background:var(--neg)}

/* bottom nav */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;border:0;background:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;padding:4px 0}
.tabbar button .ti{font-size:21px;line-height:1}
.tabbar button.on{color:var(--accent)}
.fab{position:fixed;right:18px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:31;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-size:28px;box-shadow:0 8px 24px rgba(11,110,110,.4);display:grid;place-items:center}
.fab:active{transform:scale(.94)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(5,12,13,.5);z-index:40;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease}
@media(min-width:620px){.scrim{align-items:center}.sheet{border-radius:22px;max-height:88vh}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.grip{width:38px;height:4px;border-radius:3px;background:var(--line-strong);margin:8px auto 14px}
.sheet h2{font-size:18px;margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;padding:12px;border:1px solid var(--line-strong);border-radius:11px;background:var(--surface-2);color:var(--ink)}
.field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.typetog{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.typetog button{padding:12px;border-radius:11px;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:14px;color:var(--muted)}
.typetog button.on-out{border-color:var(--neg);background:var(--neg-soft);color:var(--neg)}
.typetog button.on-in{border-color:var(--pos);background:var(--pos-soft);color:var(--pos)}
.swatchpick{display:flex;flex-wrap:wrap;gap:8px}
.swatchpick button{width:30px;height:30px;border-radius:8px;border:2px solid transparent}
.swatchpick button.on{border-color:var(--ink)}
.sheet-actions{display:flex;gap:10px;margin-top:8px}
.sheet-actions .btn{flex:1}
.del{color:var(--neg);background:0;border:0;font-weight:600;font-size:13px;margin-top:14px;width:100%;padding:10px}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin:10px 0 0}
.menu-item{display:flex;align-items:center;gap:12px;padding:15px 4px;border-bottom:1px solid var(--line);font-weight:500;font-size:14px;width:100%;background:0;border-left:0;border-right:0;border-top:0;text-align:left}
.menu-item:last-child{border-bottom:0}
.menu-item .mi{font-size:19px;width:24px;text-align:center}
.menu-item small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:2px}
.callout{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13px;line-height:1.55;color:var(--muted)}
.callout b{color:var(--ink)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px}
.chip{flex-shrink:0;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.subtotal{display:flex;justify-content:space-between;align-items:baseline;padding:16px;border-radius:14px;background:var(--surface-2);margin-bottom:6px}
.subtotal .v{font-family:"Space Grotesk";font-weight:700;font-size:26px}
.hidden{display:none!important}
.file{display:none}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="mark">C</div>
      <div><h1>Caixa</h1><small id="brandSub">seu dinheiro, claro</small></div>
    </div>
    <div class="topactions">
      <button class="iconbtn" id="themeBtn" title="Tema" aria-label="Alternar tema">◐</button>
      <button class="iconbtn" id="menuBtn" title="Menu" aria-label="Menu">≡</button>
    </div>
  </div>

  <!-- period bar (overview + transactions) -->
  <div class="periodbar" id="periodBar">
    <div class="seg" id="seg">
      <button data-p="day">Dia</button>
      <button data-p="week">Semana</button>
      <button data-p="month" class="on">Mês</button>
      <button data-p="year">Ano</button>
    </div>
    <div class="navrow">
      <button class="chev" id="prevP" aria-label="Anterior">‹</button>
      <div style="text-align:center">
        <div class="lbl" id="periodLbl">—</div>
        <button class="today" id="todayBtn">hoje</button>
      </div>
      <button class="chev" id="nextP" aria-label="Próximo">›</button>
    </div>
  </div>

  <main id="view"></main>
</div>

<button class="fab" id="fab" aria-label="Novo lançamento">+</button>

<nav class="tabbar" id="tabbar">
  <button data-v="overview" class="on"><span class="ti">◉</span>Visão</button>
  <button data-v="tx"><span class="ti">≣</span>Lançamentos</button>
  <button data-v="forecast"><span class="ti">↗</span>Previsão</button>
  <button data-v="subs"><span class="ti">↻</span>Assinaturas</button>
  <button data-v="accounts"><span class="ti">▦</span>Contas</button>
</nav>

<!-- modal host -->
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<input type="file" id="fileIn" class="file" accept=".json,.csv,.ofx,.pdf">

<script>
"use strict";
/* ---------- utils ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=> (crypto.randomUUID?crypto.randomUUID():Date.now()+''+Math.random().toString(16).slice(2));
const brl=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const PALETTE=['#0b6e6e','#e07a3f','#3b7dd8','#8a4fc4','#2f9e5a','#d8475a','#c9971f','#4aa3a3','#9c5b3b','#5a6b8c','#b5558f','#6b8f2f'];

/* ---------- state ---------- */
const KEY='caixa.v1';
let S=load();
let ui={view:'overview',period:'month',ref:new Date(), txFilter:'all', horizon:6, fcOpen:new Set()};

function load(){
  try{const raw=localStorage.getItem(KEY);if(raw)return sanitizeState(JSON.parse(raw));}catch(e){}
  return seedEmpty();
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} schedulePush(); }

/* ---------- Supabase (login + sincronização na nuvem) ---------- */
const SUPABASE_URL="https://vrvajpkmxwkfynsdqsut.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZydmFqcGtteHdrZnluc2Rxc3V0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNzM1NTUsImV4cCI6MjEwODk0OTU1NX0.8fijUBUeKVaGEebjVq4VFBqoM5b6WZIknix0u53n52I";
let sb=null, authUser=null, pushTimer=null;
function hasData(st){ return !!(st && ((st.transactions&&st.transactions.length)||(st.subscriptions&&st.subscriptions.length)||(st.cards&&st.cards.length))); }
function updateAuthUI(){ const el=document.getElementById('brandSub'); if(!el)return; el.textContent = authUser ? ('sincronizado · '+(authUser.email||'conta')) : 'seu dinheiro, claro'; }
function initAuth(){
  if(!window.supabase||!SUPABASE_URL||!SUPABASE_ANON_KEY)return;
  try{ sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); }catch(e){ sb=null; return; }
  sb.auth.onAuthStateChange((_e,session)=>{ const u=session?.user||null; const was=authUser&&authUser.id; authUser=u; updateAuthUI(); if(u&&u.id!==was)syncPull(); });
  sb.auth.getSession().then(({data})=>{ authUser=(data&&data.session&&data.session.user)||null; updateAuthUI(); if(authUser)syncPull(); }).catch(()=>{});
}
async function loginGoogle(){
  if(!sb){ alert('A sincronização só funciona no seu domínio (caixinha-delta.vercel.app), não na pré-visualização.'); return; }
  closeSheet();
  const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin}});
  if(error)alert('Falha no login: '+error.message);
}
async function logout(){ try{ if(sb)await sb.auth.signOut(); }catch(e){} authUser=null; updateAuthUI(); closeSheet(); }
async function syncPull(){
  if(!sb||!authUser)return;
  try{
    const {data,error}=await sb.from('app_state').select('data').eq('user_id',authUser.id).maybeSingle();
    if(error)throw error;
    if(data&&hasData(data.data)){
      S=sanitizeState(data.data); save(); render();
    } else {
      if(hasData(S)){
        if(confirm('Primeira vez logado neste app. Enviar os dados deste aparelho para a sua conta na nuvem?')) await syncPush(true);
      } else { await syncPush(true); }
    }
    updateAuthUI();
  }catch(e){ console.error('syncPull',e); }
}
function schedulePush(){ if(!sb||!authUser)return; clearTimeout(pushTimer); pushTimer=setTimeout(()=>syncPush_do(),1500); }
async function syncPush(){ return syncPush_do(); }
async function syncPush_do(){
  if(!sb||!authUser)return;
  try{ await sb.from('app_state').upsert({user_id:authUser.id,data:S,updated_at:new Date().toISOString()}); }
  catch(e){ console.error('syncPush',e); }
}
function seedEmpty(){
  return {
    accounts:[{id:uid(),name:'Carteira / Conta',type:'checking',opening:0,color:PALETTE[0]}],
    cards:[],
    categories:defaultCats(),
    transactions:[],
    subscriptions:[]
  };
}
function defaultCats(){
  const ex=['Mercado','Alimentação','Transporte','Moradia','Contas','Saúde','Educação','Lazer','Assinaturas','Compras','Outros'];
  const inc=['Salário','Freelance','Investimentos','Reembolso','Outros'];
  let i=0;const out=[];
  ex.forEach(n=>out.push({id:uid(),name:n,kind:'expense',color:PALETTE[i++%PALETTE.length]}));
  i=2; inc.forEach(n=>out.push({id:uid(),name:n,kind:'income',color:PALETTE[i++%PALETTE.length]}));
  return out;
}
/* ---------- DTO / validação de estado (defesa em profundidade) ---------- */
const _str=(v,max)=> (v==null?'':String(v)).slice(0,max);
const _num=v=>{const n=Number(v);return Number.isFinite(n)?n:0;};
const _enum=(v,arr,def)=>arr.includes(v)?v:def;
const _date=v=>/^\d{4}-\d{2}-\d{2}$/.test(v)?v:todayStr();
const _day=(v,def=1)=>{const n=parseInt(v);return Number.isFinite(n)?Math.min(Math.max(n,1),31):def;};
function sanitizeState(raw){
  if(!raw||typeof raw!=='object')return seedEmpty();
  const out={accounts:[],cards:[],categories:[],transactions:[],subscriptions:[]};
  const cats=(Array.isArray(raw.categories)&&raw.categories.length?raw.categories:defaultCats()).slice(0,300);
  out.categories=cats.map(c=>({id:_str(c.id,64)||uid(),name:_str(c.name,60)||'Categoria',kind:_enum(c.kind,['expense','income'],'expense'),color:_str(c.color,16)||'#888888'}));
  const catIds=new Set(out.categories.map(c=>c.id));
  out.accounts=(Array.isArray(raw.accounts)?raw.accounts:[]).slice(0,200).map(a=>{
    const o={id:_str(a.id,64)||uid(),name:_str(a.name,80)||'Conta',type:_enum(a.type,['checking','savings','wallet','cash'],'checking'),opening:_num(a.opening),color:_str(a.color,16)||'#888888'};
    if(a.extId)o.extId=_str(a.extId,128);
    if(typeof a.reported==='number')o.reported=_num(a.reported);
    return o;
  });
  if(!out.accounts.length)out.accounts=seedEmpty().accounts;
  out.cards=(Array.isArray(raw.cards)?raw.cards:[]).slice(0,200).map(c=>{
    const o={id:_str(c.id,64)||uid(),name:_str(c.name,80)||'Cartão',limit:_num(c.limit),closingDay:_day(c.closingDay,1),dueDay:c.dueDay?_day(c.dueDay,null):null,color:_str(c.color,16)||'#888888'};
    if(c.extId)o.extId=_str(c.extId,128);
    return o;
  });
  const accIds=new Set(out.accounts.map(a=>a.id));
  const cardIds=new Set(out.cards.map(c=>c.id));
  out.transactions=(Array.isArray(raw.transactions)?raw.transactions:[]).slice(0,50000).map(t=>{
    const o={id:_str(t.id,64)||uid(),type:_enum(t.type,['income','expense'],'expense'),amount:Math.abs(_num(t.amount)),
      desc:_str(t.desc,200),categoryId:catIds.has(t.categoryId)?t.categoryId:null,date:_date(t.date),
      account:accIds.has(t.account)?t.account:null,card:cardIds.has(t.card)?t.card:null,
      subId:_str(t.subId,64)||null,previsto:!!t.previsto};
    if(t.extId)o.extId=_str(t.extId,200);
    return o;
  }).filter(t=>t.amount>0);
  out.subscriptions=(Array.isArray(raw.subscriptions)?raw.subscriptions:[]).slice(0,1000).map(s=>({
    id:_str(s.id,64)||uid(),name:_str(s.name,80)||'Assinatura',amount:Math.abs(_num(s.amount)),
    freq:_enum(s.freq,['monthly','yearly','weekly'],'monthly'),categoryId:catIds.has(s.categoryId)?s.categoryId:null,
    nextDate:_date(s.nextDate),active:s.active!==false
  }));
  return out;
}
const catById=id=>S.categories.find(c=>c.id===id);
const accById=id=>S.accounts.find(a=>a.id===id);
const cardById=id=>S.cards.find(c=>c.id===id);
const catIcon=name=>({Mercado:'🛒',Alimentação:'🍽️',Transporte:'🚗',Moradia:'🏠',Contas:'🧾',Saúde:'🩺',Educação:'📚',Lazer:'🎉',Assinaturas:'↻',Compras:'🛍️',Salário:'💼',Freelance:'💻',Investimentos:'📈',Reembolso:'↩️'}[name]||'•');

/* ---------- period ---------- */
const sod=d=>{d=new Date(d);d.setHours(0,0,0,0);return d;};
const eod=d=>{d=new Date(d);d.setHours(23,59,59,999);return d;};
function range(p,ref){
  const r=new Date(ref);
  if(p==='day')return{start:sod(r),end:eod(r)};
  if(p==='week'){const off=(r.getDay()+6)%7;const s=sod(r);s.setDate(r.getDate()-off);const e=eod(s);e.setDate(s.getDate()+6);return{start:s,end:e};}
  if(p==='month')return{start:sod(new Date(r.getFullYear(),r.getMonth(),1)),end:eod(new Date(r.getFullYear(),r.getMonth()+1,0))};
  return{start:sod(new Date(r.getFullYear(),0,1)),end:eod(new Date(r.getFullYear(),11,31))};
}
function shift(p,ref,dir){
  const r=new Date(ref);
  if(p==='day')r.setDate(r.getDate()+dir);
  else if(p==='week')r.setDate(r.getDate()+7*dir);
  else if(p==='month')r.setMonth(r.getMonth()+dir);
  else r.setFullYear(r.getFullYear()+dir);
  return r;
}
function periodLabel(p,ref){
  const r=new Date(ref);
  if(p==='day')return new Intl.DateTimeFormat('pt-BR',{weekday:'short',day:'numeric',month:'short'}).format(r).replace('.','');
  if(p==='week'){const {start,end}=range('week',r);const f=d=>new Intl.DateTimeFormat('pt-BR',{day:'numeric',month:'short'}).format(d).replace('.','');return `${f(start)} – ${f(end)}`;}
  if(p==='month')return new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(r);
  return String(r.getFullYear());
}

/* ---------- aggregation ---------- */
function txInRange(list=S.transactions){
  const {start,end}=range(ui.period,ui.ref);
  return list.filter(t=>{const d=parseD(t.date);return d>=start&&d<=end;});
}
function sums(list){
  let inc=0,exp=0;
  list.forEach(t=>{t.type==='income'?inc+=t.amount:exp+=t.amount;});
  return{inc,exp,net:inc-exp};
}
function byCategory(list,kind){
  const m=new Map();
  list.filter(t=>t.type===kind).forEach(t=>{
    const c=catById(t.categoryId); const k=c?c.id:'none';
    const cur=m.get(k)||{name:c?c.name:'Sem categoria',color:c?c.color:'#888',total:0};
    cur.total+=t.amount; m.set(k,cur);
  });
  return [...m.values()].sort((a,b)=>b.total-a.total);
}
function buckets(p,ref){
  const r=new Date(ref);
  if(p==='day'){const{start,end}=range('day',r);return[{label:'hoje',start,end}];}
  if(p==='week'){const{start}=range('week',r);const out=[];const names=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
    for(let i=0;i<7;i++){const s=new Date(start);s.setDate(start.getDate()+i);out.push({label:names[i],start:sod(s),end:eod(s)});}return out;}
  if(p==='month'){const{start,end}=range('month',r);const out=[];let s=new Date(start),w=1;
    while(s<=end){const e=new Date(s);e.setDate(s.getDate()+6);out.push({label:'Sem '+w,start:sod(s),end:eod(e>end?end:e)});s.setDate(s.getDate()+7);w++;}return out;}
  const out=[];const nm=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  for(let i=0;i<12;i++)out.push({label:nm[i],start:sod(new Date(r.getFullYear(),i,1)),end:eod(new Date(r.getFullYear(),i+1,0))});
  return out;
}

/* ---------- account / card computed ---------- */
function accountBalance(a){
  if(a.extId && typeof a.reported==='number') return a.reported;
  let b=a.opening||0;
  S.transactions.forEach(t=>{
    if(t.account!==a.id) return;
    b+= t.type==='income'? t.amount : -t.amount;
  });
  return b;
}
function invoiceCycle(card,ref=new Date()){
  // current open invoice based on closing day
  const close=Math.min(Math.max(card.closingDay||1,1),28);
  const r=new Date(ref); let start,end;
  if(r.getDate()>close){ start=new Date(r.getFullYear(),r.getMonth(),close+1); end=new Date(r.getFullYear(),r.getMonth()+1,close); }
  else { start=new Date(r.getFullYear(),r.getMonth()-1,close+1); end=new Date(r.getFullYear(),r.getMonth(),close); }
  return{start:sod(start),end:eod(end)};
}
function cardInvoice(card){
  const{start,end}=invoiceCycle(card);
  let sum=0;
  S.transactions.forEach(t=>{ if(t.card===card.id&&t.type==='expense'){const d=parseD(t.date);if(d>=start&&d<=end)sum+=t.amount;} });
  return sum;
}

  wireViewEvents();
}

function viewTx(){

    else if(t.account){const a=accById(t.account);key='acc:'+t.account;name=a?a.name:'Conta';color=a?a.color:'#8a8a8a';}

  });

/* ----- forecast ----- */
const sameMonth=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth();
const mKey=d=>`${d.getFullYear()}-${d.getMonth()}`;
const mShort=d=>new Intl.DateTimeFormat('pt-BR',{month:'short'}).format(d).replace('.','');
const mFull=d=>{const s=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(d);return s.charAt(0).toUpperCase()+s.slice(1);};
function forecastData(){
  const n=ui.horizon||6;
  const base=new Date();base.setDate(1);
  const subsMonthly=S.subscriptions.filter(s=>s.active!==false).reduce((a,s)=>a+monthlyCost(s),0);
  const out=[];
  for(let i=0;i<n;i++){
    const d=new Date(base.getFullYear(),base.getMonth()+i,1);
    const items=S.transactions.filter(t=>t.previsto&&sameMonth(parseD(t.date),d)).sort((a,b)=>b.amount-a.amount);
    const parcelas=items.reduce((a,t)=>a+t.amount,0);
    out.push({d,items,parcelas,assin:subsMonthly,total:parcelas+subsMonthly});
  }
  return out;
}
function viewForecast(){
  const n=ui.horizon||6;
  const data=forecastData();
  const grand=data.reduce((a,m)=>a+m.total,0);
  const temParcelas=data.some(m=>m.parcelas>0);
  const rows=data.map(m=>{
    const key=mKey(m.d), open=ui.fcOpen.has(key);
    return `<section class="card" style="margin-bottom:10px">

function drawForecastChart(){
  const bc=$('#fcbars');if(!bc)return;
  const data=forecastData();
  const ink=cssv('--ink'),muted=cssv('--muted'),line=cssv('--line');
  charts.fcbars=new Chart(bc,{type:'bar',data:{labels:data.map(m=>mShort(m.d)),datasets:[
    {label:'Parcelas',data:data.map(m=>m.parcelas),backgroundColor:cssv('--neg'),borderRadius:5,maxBarThickness:30,stack:'s'},
    {label:'Assinaturas',data:data.map(m=>m.assin),backgroundColor:cssv('--accent'),borderRadius:5,maxBarThickness:30,stack:'s'}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:ink,boxWidth:10,boxHeight:10,usePointStyle:true,font:{family:'Inter',size:12}}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+brl(c.raw)}}},
      scales:{x:{stacked:true,grid:{display:false},ticks:{color:muted,font:{size:11}}},
        y:{stacked:true,grid:{color:line},ticks:{color:muted,font:{size:11},callback:v=>v>=1000?(v/1000)+'k':v}}}}});
}

/* transaction */
function openTx(id){
  const t=id?S.transactions.find(x=>x.id===id):null;
  const type=t?t.type:'expense';
  openSheet(`
    <h2>${t?'Editar lançamento':'Novo lançamento'}</h2>
    <div class="typetog">
      <button type="button" id="tExp" class="${type==='expense'?'on-out':''}">Saída</button>
      <button type="button" id="tInc" class="${type==='income'?'on-in':''}">Entrada</button>
    </div>
    <div class="field"><label>Valor</label><input id="fAmt" type="number" inputmode="decimal" step="0.01" placeholder="0,00" value="${t?t.amount:''}"></div>
    <div class="field"><label>Descrição</label><input id="fDesc" placeholder="Ex.: mercado da esquina" value="${t?esc(t.desc||''):''}"></div>
    <div class="row2">
      <div class="field"><label>Categoria</label><select id="fCat">${catOptions(type,t?.categoryId)}</select></div>
      <div class="field"><label>Data</label><input id="fDate" type="date" value="${t?t.date:todayStr()}"></div>
    </div>
    <div class="field"><label>Pago com</label><select id="fSrc">
      <optgroup label="Contas">${accOptions(t?.account)}</optgroup>
      ${S.cards.length?`<optgroup label="Cartões">${S.cards.map(c=>`<option value="card:${c.id}" ${t?.card===c.id?'selected':''}>${esc(c.name)} (cartão)</option>`).join('')}</optgroup>`:''}
    </select></div>
    <div class="sheet-actions"><button class="btn ghost" id="cancel">Cancelar</button><button class="btn" id="saveTx">${t?'Salvar':'Adicionar'}</button></div>
    ${t?'<button class="del" id="delTx">Excluir lançamento</button>':''}
  `);
  let curType=type;
  const setType=k=>{curType=k;$('#tExp').className=k==='expense'?'on-out':'';$('#tInc').className=k==='income'?'on-in':'';$('#fCat').innerHTML=catOptions(k,null);};
  $('#tExp').onclick=()=>setType('expense');$('#tInc').onclick=()=>setType('income');
  $('#cancel').onclick=closeSheet;
  $('#saveTx').onclick=()=>{
    const amt=parseFloat($('#fAmt').value);if(!amt||amt<=0){$('#fAmt').focus();return;}
    const srcRaw=$('#fSrc').value;const isCard=srcRaw.startsWith('card:');
    const rec={id:t?t.id:uid(),type:curType,amount:Math.abs(amt),desc:$('#fDesc').value.trim(),
      categoryId:$('#fCat').value,date:$('#fDate').value,
      account:isCard?null:srcRaw,card:isCard?srcRaw.slice(5):null, subId:t?t.subId:null};
    if(t)Object.assign(t,rec);else S.transactions.push(rec);
    save();closeSheet();render();
  };
  if(t)$('#delTx').onclick=()=>{S.transactions=S.transactions.filter(x=>x.id!==t.id);save();closeSheet();render();};
  setTimeout(()=>$('#fAmt').focus(),120);
}

/* card */
function openCardDetail(id){
  const c=cardById(id);if(!c)return;
  const {start,end}=invoiceCycle(c);
  const items=S.transactions.filter(t=>t.card===c.id&&t.type==='expense'&&parseD(t.date)>=start&&parseD(t.date)<=end).sort((a,b)=>b.date.localeCompare(a.date));
  const used=items.reduce((s,t)=>s+t.amount,0);
  const prevCount=items.filter(t=>t.previsto).length;
  const pct=c.limit?Math.min(used/c.limit*100,100):0;
  const avail=c.limit?Math.max(c.limit-used,0):null;
  const fmt=d=>new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short'}).format(d).replace('.','');
  openSheet(`
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
      <div class="swatch" style="background:${c.color}">▭</div>
      <div><h2 style="margin:0;font-size:18px">${esc(c.name)}</h2>
        <div class="hint" style="margin:0">Fatura aberta · ${fmt(start)} a ${fmt(end)}</div></div>
    </div>
    <div class="subtotal" style="margin-bottom:10px">
      <div><div style="font-size:12px;color:var(--muted);font-weight:600">Total da fatura</div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px">${items.length} lançamento(s)${prevCount?' · '+prevCount+' previsto(s)':''}</div></div>
      <div class="v num" style="color:var(--neg)">${brl(used)}</div></div>
    ${c.limit?`<div class="bar-mini"><span class="${pct>85?'warn':''}" style="width:${pct}%"></span></div>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:6px 2px 0">
      <span>limite ${brl(c.limit)}</span><span>disponível ${brl(avail)}</span></div>`:''}
    <div style="display:flex;gap:18px;font-size:12px;color:var(--muted);margin:14px 2px 2px">
      ${c.closingDay?`<span>Fecha dia <b style="color:var(--ink)">${c.closingDay}</b></span>`:''}
      ${c.dueDay?`<span>Vence dia <b style="color:var(--ink)">${c.dueDay}</b></span>`:''}
    </div>
    <div class="sec-h" style="margin:14px 2px 6px"><h2 style="font-size:14px">Lançamentos da fatura</h2></div>
    <div style="max-height:40vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:2px 12px">
      ${items.length?items.map(txRow).join(''):'<div class="hint" style="padding:14px 2px">Nenhum lançamento nesta fatura.</div>'}
    </div>
    <div class="sheet-actions" style="margin-top:14px"><button class="btn ghost" id="cdEdit">Editar cartão</button><button class="btn" id="cdClose">Fechar</button></div>
  `);
  $('#cdEdit').onclick=()=>openCard(id);
  $('#cdClose').onclick=closeSheet;
  $$('[data-edit]',sheet).forEach(el=>el.onclick=()=>openTx(el.dataset.edit));
}

/* ---------- open finance (pluggy) ---------- */
const PLUGGY_WIDGET='https://cdn.pluggy.ai/pluggy-connect/v2.5.0/pluggy-connect.js';
function loadOF(){try{return JSON.parse(localStorage.getItem('caixa.of'))||{};}catch(e){return{};}}
function saveOF(o){try{localStorage.setItem('caixa.of',JSON.stringify(o));}catch(e){}}
function ofHeaders(of){const h={'Content-Type':'application/json'};if(of.token)h['Authorization']='Bearer '+of.token;return h;}
function loadPluggyScript(){return new Promise((res,rej)=>{
  if(window.PluggyConnect)return res();
  const s=document.createElement('script');s.src=PLUGGY_WIDGET;
  s.onload=()=>res();
  s.onerror=()=>rej(new Error('Não consegui carregar o widget do Pluggy. Isso só funciona no seu próprio domínio.'));
  document.head.appendChild(s);
});}
async function connectBank(){
  const of=loadOF();
  if(!of.backend){alert('Configure a URL do servidor primeiro.');return;}
  let token;
  try{
    const r=await fetch(of.backend.replace(/\/+$/,'')+'/api/connect-token',{method:'POST',headers:ofHeaders(of)});
    const d=await r.json();
    if(!r.ok||!d.accessToken)throw new Error(d.error||'sem token');
    token=d.accessToken;
  }catch(e){alert('Falha ao falar com o servidor: '+e.message);return;}
  try{await loadPluggyScript();}catch(e){alert(e.message);return;}
  closeSheet();
  const pc=new PluggyConnect({
    connectToken:token, includeSandbox:true,
    onSuccess:(itemData)=>{const id=itemData&&(itemData.item?itemData.item.id:itemData.itemId);if(id){const o=loadOF();o.itemId=id;saveOF(o);syncBank();}},
    onError:(err)=>{alert('Erro na conexão: '+((err&&err.message)||'tente de novo'));}
  });
  pc.init();
}
async function syncBank(){
  const of=loadOF();
  if(!of.backend||!of.itemId){alert('Conecte um banco primeiro.');return;}
  let data;
  try{
    const u=of.backend.replace(/\/+$/,'')+'/api/sync?itemId='+encodeURIComponent(of.itemId);
    const r=await fetch(u,{headers:ofHeaders(of)});
    data=await r.json();
    if(!r.ok)throw new Error(data.error||('HTTP '+r.status));
  }catch(e){alert('Falha ao sincronizar: '+e.message);return;}
  const n=importPluggy(data);
  const o=loadOF();o.lastSync=new Date().toISOString();saveOF(o);
  render();
  alert(n.tx+' lançamentos novos · '+n.acc+' contas/cartões atualizados.');
}
function pluggyCat(name){
  if(!name)return null;
  const s=String(name).toLowerCase();
  const map=[['Mercado',['supermarket','groceries','mercado']],['Alimentação',['food','restaurant','aliment','bar','café','ifood','delivery']],
    ['Transporte',['transport','uber','fuel','gas','combust','mobilidade','99']],['Moradia',['rent','housing','alug','moradia']],
    ['Contas',['utilities','bill','electric','water','internet','phone','conta','telefone']],['Saúde',['health','pharmacy','médic','saúde','farm']],
    ['Educação',['education','school','educa','curso']],['Lazer',['leisure','entertain','lazer','viag','travel','cinema']],
    ['Assinaturas',['subscription','streaming','assinatura']],['Compras',['shopping','store','compra','loja','market']]];
  for(const [cat,keys] of map){if(keys.some(k=>s.includes(k)))return S.categories.find(c=>c.name===cat&&c.kind==='expense')?.id;}
  return null;
}
function importPluggy(data){
  const have=new Set(S.transactions.map(t=>t.extId).filter(Boolean));
  const accMap=new Map();
  let accN=0;
  (data.accounts||[]).forEach(a=>{
    if(a.type==='CREDIT'){
      let card=S.cards.find(c=>c.extId===a.extId);
      if(!card){card={id:uid(),extId:a.extId,name:a.name,limit:a.limit||0,closingDay:a.closingDay||1,dueDay:a.dueDay||null,color:PALETTE[(S.cards.length+1)%PALETTE.length]};S.cards.push(card);}
      else{card.name=a.name;if(a.limit)card.limit=a.limit;if(a.closingDay)card.closingDay=a.closingDay;if(a.dueDay)card.dueDay=a.dueDay;}
      accMap.set(a.extId,{kind:'card',id:card.id});accN++;
    }else{
      let ac=S.accounts.find(x=>x.extId===a.extId);
      if(!ac){ac={id:uid(),extId:a.extId,name:a.name,type:'checking',opening:0,reported:a.balance,color:PALETTE[S.accounts.length%PALETTE.length]};S.accounts.push(ac);}
      else{ac.name=a.name;ac.reported=a.balance;}
      accMap.set(a.extId,{kind:'account',id:ac.id});accN++;
    }
  });
  const outOther=S.categories.find(c=>c.kind==='expense'&&c.name==='Outros')?.id;
  const inOther=S.categories.find(c=>c.kind==='income'&&c.name==='Outros')?.id;
  let txN=0;
  (data.transactions||[]).forEach(t=>{
    if(!t.extId||have.has(t.extId))return;
    const tgt=accMap.get(t.accountExtId);
    const catId=t.kind==='expense'?(pluggyCat(t.category)||outOther):inOther;
    S.transactions.push({id:uid(),extId:t.extId,type:t.kind,amount:t.amount,desc:t.description,
      categoryId:catId,date:t.date,account:tgt&&tgt.kind==='account'?tgt.id:null,card:tgt&&tgt.kind==='card'?tgt.id:null,subId:null});
    have.add(t.extId);txN++;
  });
  save();
  return{tx:txN,acc:accN};
}

/* ---------- backup / import ---------- */
function exportJson(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=`caixa-backup-${todayStr()}.json`;a.click();URL.revokeObjectURL(url);
  closeSheet();
}
let importMode='json';
function pickFile(mode){importMode=mode;$('#fileIn').value='';$('#fileIn').click();}
$('#fileIn').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  if(importMode==='pdf'){
    rd.onload=()=>importFaturaPDF(rd.result);
    rd.readAsDataURL(f);
    return;
  }
  rd.onload=()=>{
    try{
      if(importMode==='json'){ const data=JSON.parse(rd.result);
        if(data.transactions){S=sanitizeState(data);save();closeSheet();render();alert('Backup restaurado e validado.');}
      } else { importStatement(rd.result,f.name); }
    }catch(err){alert('Não consegui ler esse arquivo. Verifique o formato.');}
  };
  rd.readAsText(f);
};

/* ---------- import fatura (PDF + IA) ---------- */
async function importFaturaPDF(dataUrl){
  const of=loadOF();
  if(!of.backend){alert('Configure o servidor em Open Finance primeiro (URL + token).');return;}
  const b64=(dataUrl.split(',')[1])||'';
  openSheet('<div class="grip"></div><h2>Lendo a fatura…</h2><p class="hint">A IA está extraindo as compras. Isso leva alguns segundos.</p>');
  let data;
  try{
    const r=await fetch(of.backend.replace(/\/+$/,'')+'/api/parse-fatura',{method:'POST',headers:ofHeaders(of),body:JSON.stringify({pdf:b64})});
    const raw=await r.text();
    try{ data=JSON.parse(raw); }catch{ data=null; }
    if(!r.ok||!data){
      const msg = data?.error || (r.status>=500 ? 'o servidor demorou ou a IA está ocupada. Tente de novo em instantes.' : ('resposta inesperada do servidor ('+r.status+')'));
      throw new Error(msg);
    }
  }catch(err){alert('Não consegui ler a fatura: '+err.message);closeSheet();return;}
  const compras=(data.compras||[]).filter(c=>c.valor_parcela>0);
  if(!compras.length){alert('A IA não encontrou compras nesse PDF. Tente outra fatura.');closeSheet();return;}
  faturaPreview(data);
}

function monthValue(iso){ const d=iso&&/^\d{4}-\d{2}/.test(iso)?new Date(iso):new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function normName(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();}
function findCardByName(name){
  const n=normName(name); if(!n)return null;
  return S.cards.find(c=>{const cn=normName(c.name);return cn&&(cn===n||cn.includes(n)||n.includes(cn));})||null;
}

function faturaPreview(data){
  const compras=(data.compras||[]).filter(c=>c.valor_parcela>0);
  const vencimento=data.fatura_vencimento;
  const refMonth=monthValue(vencimento);
  const emissor=(data.emissor||'').trim();
  const final=String(data.cartao_final||'').replace(/\D/g,'').slice(-4);
  const bandeira=(data.bandeira||'').trim();
  const suggested = emissor ? (emissor + (final?` ••${final}`:'')) : 'Cartão de crédito';
  const matched = findCardByName(suggested) || (emissor?findCardByName(emissor):null);
  const totalMes=compras.reduce((s,c)=>s+c.valor_parcela,0);
  const parceladas=compras.filter(c=>c.parcelas_total>1).length;
  const rows=compras.map((c)=>`<div class="tx" style="padding:10px 2px">
    <div class="mid"><div class="d">${esc(c.descricao)}${c.parcelas_total>1?`<span class="tag">${c.parcela_atual}/${c.parcelas_total}</span>`:''}</div>
      <div class="m">${c.data?new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short'}).format(parseD(c.data)).replace('.',''):'—'}${c.parcelas_total>1?' · total '+brl(c.valor_total):''}</div></div>
    <div class="amt num out">${brl(c.valor_parcela)}</div></div>`).join('');
  const cardSel=`<select id="fCard">
    <option value="new" ${matched?'':'selected'}>➕ Novo cartão: ${esc(suggested)}</option>
    ${S.cards.map(c=>`<option value="${c.id}" ${matched&&matched.id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
  </select>`;
  const detected = emissor ? `${esc(emissor)}${final?' ••'+final:''}${bandeira?' · '+esc(bandeira):''}` : 'não identificado';
  openSheet(`<h2>Fatura · ${compras.length} compras</h2>
    <div class="callout" style="margin-bottom:14px;display:flex;align-items:center;gap:10px">
      <span style="font-size:18px">💳</span>
      <div>Cartão detectado: <b style="color:var(--ink)">${detected}</b>${matched?' <span class="tag">já cadastrado</span>':' <span class="tag">novo</span>'}</div>
    </div>
    <div class="row2">
      <div class="field"><label>Mês de referência</label><input id="fRef" type="month" value="${refMonth}"></div>
      <div class="field"><label>Lançar no cartão</label>${cardSel}</div>
    </div>
    <div class="subtotal"><div><div style="font-size:12px;color:var(--muted);font-weight:600">parcelas deste mês</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">${parceladas} compra(s) parcelada(s)</div></div>
      <div class="v num" style="color:var(--neg)">${brl(totalMes)}</div></div>
    <div style="max-height:32vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:2px 12px;margin-bottom:8px">${rows}</div>
    <p class="hint">A parcela deste mês vira gasto normal; as futuras viram <b>previsto</b>. Se o cartão for novo, ele é criado automaticamente. Os lançamentos aparecem todos juntos; a separação por cartão fica na aba Contas.</p>
    <div class="sheet-actions"><button class="btn ghost" id="fCancel">Cancelar</button><button class="btn" id="fImport">Importar</button></div>`);
  $('#fCancel').onclick=closeSheet;
  $('#fImport').onclick=()=>applyFatura(compras,suggested,vencimento);
}

function resolveCard(sel,suggested,vencimento){
  if(sel&&sel!=='new'){ const c=cardById(sel); if(c)return c.id; }
  let card=findCardByName(suggested);
  if(!card){
    const dueDay = vencimento&&/^\d{4}-\d{2}-(\d{2})/.test(vencimento)?parseInt(vencimento.slice(8,10)):null;
    card={id:uid(),name:suggested||'Cartão de crédito',limit:0,closingDay:1,dueDay,color:PALETTE[(S.cards.length+1)%PALETTE.length]};
    S.cards.push(card);
  }
  return card.id;
}

function ensureSubscription(name,amount,ry,rm){
  const assinCat=S.categories.find(c=>c.kind==='expense'&&c.name==='Assinaturas')?.id;
  const existing=S.subscriptions.find(s=>normName(s.name)===normName(name));
  if(existing){ existing.active=true; if(amount)existing.amount=amount; return {id:existing.id,created:false}; }
  const nd=new Date(ry,rm,1); // mês seguinte ao de referência
  const nextDate=`${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}-01`;
  const sub={id:uid(),name:name||'Assinatura',amount:amount||0,freq:'monthly',categoryId:assinCat,nextDate,active:true};
  S.subscriptions.push(sub);
  return {id:sub.id,created:true};
}

function applyFatura(compras,suggested,vencimento){
  const refStr=$('#fRef').value||monthValue(null);
  const [ry,rm]=refStr.split('-').map(Number);
  const cardId=resolveCard($('#fCard').value,suggested,vencimento);
  const outOther=S.categories.find(c=>c.kind==='expense'&&c.name==='Outros')?.id;
  const assinCat=S.categories.find(c=>c.kind==='expense'&&c.name==='Assinaturas')?.id;
  const have=new Set(S.transactions.map(t=>t.extId).filter(Boolean));
  const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,18);
  let realN=0, prevN=0, subN=0;
  compras.forEach(c=>{
    const day = c.data&&/^\d{4}-\d{2}-(\d{2})/.test(c.data) ? parseInt(c.data.slice(8,10)) : 1;
    const isSub = !!c.assinatura;
    let subId=null;
    if(isSub){ const r=ensureSubscription((c.servico||c.descricao||'Assinatura').trim(),c.valor_parcela,ry,rm); subId=r.id; if(r.created)subN++; }
    const cat = isSub ? (assinCat||outOther) : (pluggyCat(c.descricao)||outOther);
    const total=c.parcelas_total||1, atual=c.parcela_atual||1;
    for(let k=atual;k<=total;k++){
      const off=k-atual;
      const d=new Date(ry, (rm-1)+off, Math.min(day,28));
      const date=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const previsto = off>0;
      const extId=`fat:${cardId}:${slug(c.descricao)}:${total}:${Math.round(c.valor_parcela*100)}:${ry}-${rm}:${k}`;
      if(have.has(extId))continue;
      S.transactions.push({id:uid(),extId,type:'expense',amount:c.valor_parcela,
        desc:c.descricao+(total>1?` (${k}/${total})`:''),categoryId:cat,date,
        account:null,card:cardId,subId,previsto});
      have.add(extId); previsto?prevN++:realN++;
    }
  });
  save();closeSheet();render();
  const cardName=cardById(cardId)?.name||'cartão';
  let msg=`Importado em "${cardName}": ${realN} lançamento(s) deste mês · ${prevN} parcela(s) futura(s).`;
  if(subN)msg+=`\n${subN} assinatura(s) detectada(s) e adicionada(s) na aba Assinaturas.`;
  alert(msg);
}
function importStatement(text,name){
  let added=0; const acc=S.accounts[0]?.id;
  const outCat=S.categories.find(c=>c.kind==='expense'&&c.name==='Outros')?.id;
  const inCat=S.categories.find(c=>c.kind==='income'&&c.name==='Outros')?.id;
  if(/\.ofx$/i.test(name)||/<OFX>/i.test(text)){
    const trns=text.split(/<STMTTRN>/i).slice(1);
    trns.forEach(blk=>{
      const amt=parseFloat((blk.match(/<TRNAMT>([^<\r\n]+)/i)||[])[1]);
      const dt=(blk.match(/<DTPOSTED>(\d{4})(\d{2})(\d{2})/i)||[]);
      const memo=(blk.match(/<MEMO>([^<\r\n]+)/i)||[])[1]||'';
      if(!isNaN(amt)&&dt[1]){
        S.transactions.push({id:uid(),type:amt<0?'expense':'income',amount:Math.abs(amt),desc:memo.trim(),categoryId:amt<0?outCat:inCat,date:`${dt[1]}-${dt[2]}-${dt[3]}`,account:acc,card:null,subId:null});added++;
      }
    });
  } else {
    const lines=text.split(/\r?\n/).filter(l=>l.trim());
    const sep=lines[0].includes(';')?';':',';
    lines.forEach((l,i)=>{
      const parts=l.split(sep).map(s=>s.replace(/^"|"$/g,'').trim());
      if(parts.length<3)return;
      // heuristics: find date, value
      let date=null,val=null,desc='';
      parts.forEach(p=>{
        const dm=p.match(/(\d{2})\/(\d{2})\/(\d{4})/)||p.match(/(\d{4})-(\d{2})-(\d{2})/);
        if(dm&&!date){ date= dm[3].length===4?`${dm[3]}-${dm[2]}-${dm[1]}`:`${dm[1]}-${dm[2]}-${dm[3]}`; }
      });
      const vm=parts.map(p=>p.replace(/[R$\s.]/g,'').replace(',','.')).map(parseFloat).filter(n=>!isNaN(n));
      if(vm.length){val=vm[vm.length-1];}
      desc=parts.find(p=>!/^\d/.test(p)&&p.length>2)||'Importado';
      if(date&&val!=null&&i>0){ // skip header row
        S.transactions.push({id:uid(),type:val<0?'expense':'income',amount:Math.abs(val),desc,categoryId:val<0?outCat:inCat,date,account:acc,card:null,subId:null});added++;
      }
    });
  }
  save();closeSheet();render();
  alert(added?`${added} lançamentos importados. Revise as categorias quando puder.`:'Não encontrei transações legíveis. Me manda um exemplo do arquivo no chat que eu ajusto a importação.');
}

  save();render();
}

/* ---------- theme ---------- */
function applyTheme(t){ if(t)document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme');
  try{localStorage.setItem('caixa.theme',t||'');}catch(e){} }
(function initTheme(){try{const t=localStorage.getItem('caixa.theme');if(t)applyTheme(t);}catch(e){}})();
$('#themeBtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const sysDark=matchMedia('(prefers-color-scheme: dark)').matches;
  const next= cur? (cur==='dark'?'light':'dark') : (sysDark?'light':'dark');
  applyTheme(next); if(ui.view==='overview')render();
};
